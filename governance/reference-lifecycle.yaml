schemaVersion: 1
artifactId: UABC-GOV-REFERENCE-001
title: Stabiler Referenzlebenszyklus
states: [proposed, approved, historical, superseded, retired]
resolutionOrder:
  - state: approved
    pathPattern: openspec/specs/**/spec.md
  - state: proposed
    pathPattern: openspec/changes/*/specs/**/spec.md
  - state: historical
    pathPattern: openspec/changes/archive/*/specs/**/spec.md
rules:
  stableReferenceFormat: fachliche ID, kein Change-Pfad
  activeChangesAllowed: 0..1
  approvedTruthPath: openspec/specs
  historicalFallbackOnly: true
  canonicalStructuredPaths:
    architecture-baseline: { path: architecture/enterprise-blueprint.yaml, selector: actualSandboxBaseline }
    capability-catalog: { path: capabilities/catalog.yaml, selector: root }
    projektdaten-index: { path: exports/project-data/v1/index.yaml, selector: root }
    verification-register: { path: evidence/verification-register.yaml, selector: verifications }
    walkthrough-package-registry: { path: exports/project-artifacts/v0.1/index.yaml, selector: artifacts }
  archivePreconditions:
    - automatisiertes Policy-Gate des Changes erfuellt
    - kanonische strukturierte Artefakte von proposed nach approved aktualisiert
    - alle erforderlichen Nachweise bestanden
    - aktive Change-Specs strict-valide und durch OpenSpec-Archivierung mergebar
    - lokale Validierung bestanden
  conflictRule: doppelte IDs innerhalb eines Lifecycle-Status sind ungueltig; statusuebergreifende Aufloesung folgt approved vor proposed vor historical
