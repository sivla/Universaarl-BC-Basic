  - { id: UABC-DEC-002, status: approved, decidedAt: 2026-07-10, statement: Organizational objects exist only for a distinct process or control purpose }
  - { id: UABC-DEC-003, status: approved, decidedAt: 2026-07-10, statement: Warehouse complexity differs by location }
  - { id: UABC-DEC-004, status: approved, decidedAt: 2026-07-10, statement: COSTCENTER and BUSINESSUNIT are global dimensions }
  - { id: UABC-DEC-005, status: approved, decidedAt: 2026-07-10, statement: Standard-first; extensions require a proven gap and separate change }
  - { id: UABC-DEC-006, status: approved, decidedAt: 2026-07-10, statement: OpenSpec is normative; Jira and Confluence are collaboration views }
  - { id: UABC-DEC-007, status: approved, decidedAt: 2026-07-10, statement: Dataverse and Dynamics 365 Sales are outside the core project; later adoption needs a positive business case and separate OpenSpec change while native BC-adjacent sales functions may be assessed }
  - { id: UABC-DEC-008, status: approved, decidedAt: 2026-07-10, statement: UAM-DE is the sole standard master-data synchronization source company for party identity shared dictionaries and commercial item core; production and all legal-entity transactional fields remain local }
