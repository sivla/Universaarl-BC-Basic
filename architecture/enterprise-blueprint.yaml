securityPrinciples:
  - Entra-Sicherheitsgruppen steuern den Umgebungszugang und die Rollengruppierung.
  - BC-Berechtigungssätze gewähren das Least-Privilege-Prinzip und sind bei Bedarf unternehmensbezogen.
  - Profile und Role Centers dienen der Bedienbarkeit, nicht als Sicherheitskontrolle.
  - SUPER ist auf Sandbox-Administration und Notfallzugriff beschränkt.
  - Native Genehmigungsworkflows werden zuerst für Einkauf, Verkauf, Zahlungsjournale und kritische Stammdaten geprüft.
