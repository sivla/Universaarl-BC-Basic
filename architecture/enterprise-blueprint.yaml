licensingModel:
  status: proposed
  sourceIds: [SRC-BC-010, SRC-BC-011, SRC-BC-026, SRC-BC-030]
  companyExperience:
    UAM-DE: Essentials
    UAS-DE: Premium
    UAD-DE: Premium
    UAP-DE: Essentials
    UAC-CONS: Essentials
  rules:
    - Manufacturing in UAS-DE und Service Management in UAD-DE benötigen Premium Experience und entsprechend berechtigte Benutzer.
    - Ein Essentials-Benutzer kann sich nicht in einem Unternehmen mit Premium Experience anmelden; unternehmensübergreifende Rollen für UAS-DE oder UAD-DE sind Premium-Kandidaten.
    - Team Member und Microsoft-365-Zugriff ersetzen keine vollständigen Verarbeitungsrechte.
    - Die finale SKU-Kombination, Gerätelizenzierung und Tenant-Kapazität benötigen aktuelle Product Terms und eine Partnerbestätigung.
localizationAndFinance:
  countryReference: Germany
  actualAvailabilityRef: actualSandboxBaseline.facts.localization
  sourceIds: [SRC-BC-012, SRC-BC-013, SRC-BC-014, SRC-BC-015, SRC-BC-016, SRC-BC-017]
  strategy:
    chartOfAccounts: harmonized group chart with company-specific exceptions and explicit consolidation mapping
    postingGroups: common code semantics; account assignments are company-owned and change-logged
    vat: German VAT business/product posting matrix and VAT reporting must be designed and tax-reviewed
    electronicInvoicing: XRechnung Peppol and ZUGFeRD are target formats only after playthru version and installed apps are evidenced
    payments: SEPA export with preparer/approver separation; bank portal transmission remains outside Business Central proof
    reporting: Financial Reports and Analysis Views first; Power BI deferred until reconciliation and semantic ownership
masterDataStrategy:
  sourceIds: [SRC-BC-019]
  principle: Zentrale Governance bedeutet nicht identische Datensätze in jedem BC-Unternehmen.
  sourceCompany: UAM-DE
  sharedCandidates: [dimension codes and values, payment terms, units of measure, item categories, selected party identity fields]
  companySpecific: [posting groups, bank accounts, credit limits, prices, tax registrations, locations, planning parameters, vendor purchasing terms]
  synchronizationConstraint: Die Standardsynchronisierung zieht Daten innerhalb einer Umgebung unidirektional; bidirektionale Synchronisierung wird ausgeschlossen.
  commercialMasterPolicy: UAM-DE verantwortet Parteistammdaten, gemeinsame Wörterbücher und den synchronisierten kommerziellen Artikelkern.
  productMasterRecommendation: UAS-DE ergänzt lokale, nicht synchronisierte Produktionsstücklisten, Arbeitspläne, Kapazitäten, Engineering- und weitere Fertigungsfelder zum kommerziellen Artikelkern von UAM-DE.
  partyMasterRecommendation: P-016 verantwortet Identität und Dublettenvermeidung in UAM-DE; jede Gesellschaft besitzt ihre transaktionalen, gesetzlichen, Kredit-, Preis-, Einkaufs-, Standort- und Planungsfelder.
  activationGate: Vor Aktivierung der Synchronisierung müssen eine Eigentums- und Synchronisierungsmatrix auf Feldebene sowie ein erfolgreicher playthru-PoC vorliegen.
deliveryWorkstreams:
  sourceIds: [SRC-BC-035, SRC-BC-036, SRC-BC-038, SRC-BC-039, SRC-BC-040, SRC-BC-041, SRC-BC-042, SRC-BC-044]
  W1: Strategie, Dateninventar, Verantwortliche, kontrollierte Vorlagen, Testplan, Trainings- und Adoptionsplan, lokale Financial Reports und Dimensionsprüfungen
  W2: Mapping, Bereinigung, Mock Load 1, Einbindung der Key User und IC-Beleggrundlage UAS nach UAD
  W3: Mock Load 2, integrierte Prozesstests, Entwicklung der Trainingsinhalte und Befähigung der Modul-Key-User
  W4: UAT-Datenlauf, Abstimmung, fachliche Abnahme, Train-the-Trainer, Cutover-Probe, vollständige IC-Abstimmung und Konzernreporting
  W5: finaler Load, Endanwendertraining, Cutover, Hypercare und gemessener Übergang in den Support
dataDeliveryModel:
  sourceIds: [SRC-BC-036, SRC-BC-037]
  setupData: Configuration Worksheet und geprüfte Configuration Packages; nur freigegebenes Setup mit unternehmensspezifischen Werten und Wiederholungslaufprotokoll übertragen
  masterData: kontrollierter Excel-Austausch und Configuration Packages mit Configuration Templates für freigegebene Defaults; der Objektverantwortliche prüft Identität und Unternehmensfelder
  openEntries: objektspezifische Vorlagen oder Journale mit Belegverknüpfung, Überfälligkeit, Bestandswert und Abstimmung von Nebenbuch zu Hauptbuch
  postedData: keine Massenerzeugung historischer gebuchter Transaktionen über Configuration Packages; zugängliches Legacy-Archiv erhalten oder nur ausdrücklich freigegebene Eröffnungspositionen mit Audit-Abstimmung migrieren
  control: jede Datei und jedes Package enthält Verantwortlichen, Quellauszug, Transformation, Version, Ladereihenfolge, Lauf-ID, Fehlerbehandlung, Abstimmung sowie Reset- oder Wiederholungshinweis
