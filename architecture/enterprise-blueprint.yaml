crossFunctionalReview:
  reviewedAt: 2026-07-10
  reviewType: consultant architecture review followed by explicit real-user decision
  conclusion: conditionally approved as W0 planning baseline with W1 gates and no BC-write authorization
  findings:
    - severity: high
      topic: legal entities
      finding: Four legal entities are plausible only with distinct contracts employees assets tax registrations bank accounts and risk ownership; otherwise UAM-DE or UAP-DE may be organizational over-segmentation.
    - severity: high
      topic: licensing
      finding: UAS-DE Manufacturing and UAD-DE Service Management create Premium dependencies that affect every cross-company user role.
    - severity: high
      topic: German compliance
      finding: VAT e-invoicing service invoices and payment formats cannot be finalized before actual playthru version localization and extensions are evidenced.
    - severity: high
      topic: master data
      finding: One universal golden-record company is not credible for both product engineering and legal-entity-specific party data under unidirectional standard synchronization.
    - severity: high
      topic: intercompany
      finding: The proposed flows are plausible but transfer pricing lead-contractor warranty ownership and reconciliation rules are not yet defined.
    - severity: medium
      topic: warehouse
      finding: NK-WERK Advanced Warehouse is a target hypothesis requiring volume layout role and scanner evidence; it is not yet a configuration decision.
    - severity: medium
      topic: delivery waves
      finding: W2 combines trade inventory basic and advanced warehouse too aggressively; Advanced Warehouse should follow stable trade and inventory foundations.
    - severity: medium
      topic: migration and UAT
      finding: Migration testing UAT training cutover and hypercare must run across W1 to W5; their object volumes history open balances tracking project WIP installed base assets attachments privacy and reconciliation requirements remain to be deliberately quantified.
