    UAM-DE: P-005
    UAP-DE: P-005 supported by P-015 for project billing evidence
    UAS-DE: P-017 with P-006 as controller and P-003 as approver
    UAD-DE: P-018 with P-003 as approver
  warehouseKeyUsers:
    UAS-DE: P-009
    UAD-DE: P-019 supported by P-012 for service stock and P-013 for vehicle stock
  migration: P-016 koordiniert; P-005, P-017 und P-018 stimmen die Unternehmensbücher ab; P-006 stimmt Produktionsbestand und Kosten ab
  training: P-015 koordiniert; jeder Modul-Key-User entwickelt und vermittelt das eigene Rollentraining
  uat: Prozessverantwortliche nehmen ihren Scope ab; P-002 koordiniert und P-015 darf keine Module an ihrer Stelle abnehmen
decisions:
  - { id: UABC-DEC-001, status: approved, decidedAt: 2026-07-10, statement: Vier operative Gesellschaften bleiben bestehen, ergänzt um das nicht operative UAC-CONS; UAM ist eine substanzielle Holding- und Shared-Service-Gesellschaft, UAP besitzt Projektverträge, Ressourcen und Risiken }
  - { id: UABC-DEC-002, status: approved, decidedAt: 2026-07-10, statement: Organisationsobjekte existieren nur für einen eigenständigen Prozess- oder Kontrollzweck }
  - { id: UABC-DEC-003, status: approved, decidedAt: 2026-07-10, statement: Die Lagerkomplexität unterscheidet sich je Standort }
  - { id: UABC-DEC-004, status: approved, decidedAt: 2026-07-10, statement: COSTCENTER und BUSINESSUNIT sind globale Dimensionen }
  - { id: UABC-DEC-005, status: approved, decidedAt: 2026-07-10, statement: Standard zuerst; Erweiterungen benötigen eine belegte Lücke und einen separaten Change }
  - { id: UABC-DEC-006, status: approved, decidedAt: 2026-07-10, statement: OpenSpec ist normativ; Jira und Confluence sind Kooperationsansichten }
  - { id: UABC-DEC-007, status: approved, decidedAt: 2026-07-10, statement: Dataverse und Dynamics 365 Sales liegen außerhalb des Kernprojekts; eine spätere Einführung benötigt einen positiven Business Case und einen separaten OpenSpec-Change, während native BC-nahe Vertriebsfunktionen geprüft werden dürfen }
  - { id: UABC-DEC-008, status: approved, decidedAt: 2026-07-10, statement: UAM-DE ist die einzige Standard-Quellgesellschaft für Parteistammdaten, gemeinsame Wörterbücher und den kommerziellen Artikelkern; Produktion und alle transaktionalen Felder der Gesellschaften bleiben lokal }
