securityPrinciples:
  - Entra security groups control environment admission and role grouping.
  - BC permission sets grant least privilege and are company-scoped where required.
  - Profiles and Role Centers are usability features, not security controls.
  - SUPER is restricted to sandbox administration and break-glass use.
  - Native approval workflows are evaluated first for purchasing, sales, payment journals and critical master data.
operatingModel:
  financeProcessing:
    UAM-DE: P-005
    UAP-DE: P-005 supported by P-015 for project billing evidence
    UAS-DE: P-017 with P-006 as controller and P-003 as approver
    UAD-DE: P-018 with P-003 as approver
  warehouseKeyUsers:
    UAS-DE: P-009
    UAD-DE: P-019 supported by P-012 for service stock and P-013 for vehicle stock
  migration: P-016 coordinates; P-005 P-017 and P-018 reconcile company ledgers; P-006 reconciles production inventory and cost
  training: P-015 coordinates; each module key user develops and delivers their own role training
  uat: business process owners accept their scope; P-002 coordinates and P-015 cannot accept modules on their behalf
