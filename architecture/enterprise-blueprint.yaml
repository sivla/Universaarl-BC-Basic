  localization:
    planned: Germany
    actual: unknown
licensingModel:
  status: proposed
  sourceIds: [SRC-BC-010, SRC-BC-011, SRC-BC-026, SRC-BC-030]
  companyExperience:
    UAM-DE: Essentials
    UAS-DE: Premium
    UAD-DE: Premium
    UAP-DE: Essentials
    UAC-CONS: Essentials
  rules:
    - Manufacturing in UAS-DE and Service Management in UAD-DE require Premium experience and entitled users.
    - An Essentials user cannot sign in to a Premium-experience company; cross-company roles for UAS-DE or UAD-DE are Premium candidates.
    - Team Member and Microsoft 365 access are not substitutes for full processing rights.
    - Final SKU mix device licensing and tenant capacity require current Product Terms and partner confirmation.
localizationAndFinance:
  countryReference: Germany
  actualAvailability: unknown
  sourceIds: [SRC-BC-012, SRC-BC-013, SRC-BC-014, SRC-BC-015, SRC-BC-016, SRC-BC-017]
  strategy:
    chartOfAccounts: harmonized group chart with company-specific exceptions and explicit consolidation mapping
    postingGroups: common code semantics; account assignments are company-owned and change-logged
    vat: German VAT business/product posting matrix and VAT reporting must be designed and tax-reviewed
    electronicInvoicing: XRechnung Peppol and ZUGFeRD are target formats only after playthru version and installed apps are evidenced
    payments: SEPA export with preparer/approver separation; bank portal transmission remains outside Business Central proof
    reporting: Financial Reports and Analysis Views first; Power BI deferred until reconciliation and semantic ownership
masterDataStrategy:
  sourceIds: [SRC-BC-019]
  principle: Central governance does not mean identical records in every BC company.
  sourceCompany: UAM-DE
  sharedCandidates: [dimension codes and values, payment terms, units of measure, item categories, selected party identity fields]
  companySpecific: [posting groups, bank accounts, credit limits, prices, tax registrations, locations, planning parameters, vendor purchasing terms]
  synchronizationConstraint: Standard synchronization is unidirectional pull within one environment; bidirectional synchronization is rejected.
  commercialMasterPolicy: UAM-DE owns party identity shared dictionaries and the synchronized commercial item core.
  productMasterRecommendation: UAS-DE adds local non-synchronized Production BOMs routings capacities engineering and other manufacturing fields to the UAM-DE commercial item core.
  partyMasterRecommendation: P-016 governs UAM-DE identity and duplicate prevention while each legal entity owns transactional statutory credit price purchasing location and planning fields.
  activationGate: Field-level ownership and synchronization matrix plus successful playthru proof of concept before synchronization is enabled.
deliveryWorkstreams:
  sourceIds: [SRC-BC-035, SRC-BC-036, SRC-BC-038, SRC-BC-039, SRC-BC-040, SRC-BC-041, SRC-BC-042, SRC-BC-044]
  W1: strategy data inventory owners controlled templates test plan training and adoption plan local Financial Reports and dimension checks
  W2: mapping cleansing Mock Load 1 key-user involvement and UAS-to-UAD intercompany document foundation
  W3: Mock Load 2 integrated process tests training-content development and module-key-user enablement
  W4: UAT data run reconciliation business acceptance train-the-trainer cutover rehearsal full intercompany reconciliation and group reporting
  W5: final load end-user training cutover hypercare and measured transition to support
dataDeliveryModel:
  sourceIds: [SRC-BC-036, SRC-BC-037]
  setupData: Configuration Worksheet and reviewed Configuration Packages; promote only approved setup with company-specific values and rerun log
  masterData: controlled Excel exchange and Configuration Packages with Configuration Templates for approved defaults; object owner validates identity and company fields
  openEntries: object-specific templates or journals with document linkage aging inventory value and subledger-to-ledger reconciliation
  postedData: no bulk recreation of historical posted transactions through configuration packages; retain an accessible legacy archive or migrate only explicitly approved opening positions with audit reconciliation
  control: every file and package has owner source extract transform version load order run ID error disposition reconciliation and reset or rerun instruction
