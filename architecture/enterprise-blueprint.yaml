licensingModel:
  status: proposed
  sourceIds: [SRC-BC-010, SRC-BC-011, SRC-BC-026, SRC-BC-030]
  companyExperience:
    UAM-DE: Essentials
    UAS-DE: Premium
    UAD-DE: Premium
    UAP-DE: Essentials
    UAC-CONS: Essentials
  rules:
    - Fertigung in UAS-DE und Service Management in UAD-DE erfordern die Premium Experience und entsprechend berechtigte Benutzer.
    - Ein Essentials-Benutzer kann sich nicht in einem Unternehmen mit Premium Experience anmelden; unternehmensuebergreifende Rollen fuer UAS-DE oder UAD-DE sind Premium-Kandidaten.
    - Team Member und Microsoft-365-Zugriff ersetzen keine vollstaendigen Verarbeitungsrechte.
    - Die abschliessende SKU-Kombination, Geraetelizenzierung und Mandantenkapazitaet erfordern aktuelle Product Terms und eine Partnerbestaetigung.
