crossFunctionalReview:
  reviewedAt: 2026-07-10
  reviewType: beratende Architekturpruefung mit anschliessender ausdruecklicher Entscheidung durch einen tatsaechlichen Benutzer
  conclusion: unter Auflagen als W0-Planungsgrundlage mit W1-Freigabepunkten und ohne Berechtigung fuer Schreibvorgaenge in Business Central genehmigt
  findings:
    - severity: high
      topic: Rechtstraeger
      finding: Vier Rechtstraeger sind nur mit jeweils eigenen Vertraegen, Beschaeftigten, Vermoegenswerten, Steuerregistrierungen, Bankkonten und eigener Risikoverantwortung plausibel; andernfalls koennten UAM-DE oder UAP-DE organisatorisch uebersegmentiert sein.
    - severity: high
      topic: Lizenzierung
      finding: Fertigung in UAS-DE und Kundendienstverwaltung in UAD-DE erzeugen Premium-Abhaengigkeiten, die jede unternehmensuebergreifende Benutzerrolle betreffen.
    - severity: high
      topic: deutsche Rechtskonformitaet
      finding: MwSt.-Behandlung, elektronische Rechnungsstellung, Dienstleistungsrechnungen und Zahlungsformate koennen erst abschliessend festgelegt werden, wenn die tatsaechliche playthru-Version, die Lokalisierung und die Erweiterungen nachgewiesen sind.
    - severity: high
      topic: Stammdaten
      finding: Eine universelle, fuer alle fuehrende Stammdatengesellschaft ist sowohl fuer die Produktentwicklung als auch fuer rechtstraegerspezifische Geschaeftspartnerdaten bei unidirektionaler Standardsynchronisierung nicht tragfaehig.
    - severity: high
      topic: IC-Geschaefte
      finding: Die vorgeschlagenen Ablaeufe sind plausibel, doch Regeln fuer Verrechnungspreise, die Rolle des federfuehrenden Auftragnehmers, Garantie, Eigentum und Abstimmung sind noch nicht definiert.
    - severity: medium
      topic: Lager
      finding: Die erweiterte Lagerverwaltung in NK-WERK ist eine Zielhypothese, die Nachweise zu Volumen, Lageranordnung, Rollen und Scannern erfordert; sie ist noch keine Konfigurationsentscheidung.
    - severity: medium
      topic: Umsetzungswellen
      finding: W2 buendelt Handel, Bestand sowie einfache und erweiterte Lagerverwaltung zu aggressiv; die erweiterte Lagerverwaltung sollte auf stabilen Grundlagen fuer Handel und Bestand aufbauen.
    - severity: medium
      topic: Migration und UAT
      finding: Migrationstests, UAT, Schulung, Produktivumstellung und intensive Nachbetreuung muessen von W1 bis W5 durchgaengig erfolgen; Anforderungen an Objektvolumina, Historie, offene Salden, Nachverfolgung, Projekt-WIP, installierte Basis, Anlagen, Anhaenge, Datenschutz und Abstimmung muessen weiterhin bewusst quantifiziert werden.
