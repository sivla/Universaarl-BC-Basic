securityPrinciples:
  - Entra-Sicherheitsgruppen steuern den Umgebungszugang und die Rollengruppierung.
  - BC-Berechtigungssaetze setzen das Prinzip der geringstmoeglichen Berechtigungen um und sind bei Bedarf unternehmensbezogen.
  - Profile und Rollencenter dienen der Bedienbarkeit, nicht als Sicherheitskontrolle.
  - SUPER ist auf die Sandbox-Verwaltung und den Notfallzugriff beschraenkt.
  - Standardgenehmigungsablaeufe werden zuerst fuer Einkauf, Verkauf, Zahlungsbuchungsblaetter und kritische Stammdaten geprueft.
