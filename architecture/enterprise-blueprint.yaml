  countryReference: Germany
  actualAvailabilityRef: actualSandboxBaseline.facts.localization
  sourceIds: [SRC-BC-012, SRC-BC-013, SRC-BC-014, SRC-BC-015, SRC-BC-016, SRC-BC-017]
  strategy:
    chartOfAccounts: harmonisierter Konzernkontenplan mit unternehmensspezifischen Ausnahmen und expliziter Konsolidierungszuordnung
    postingGroups: einheitliche Codesemantik; Kontenzuordnungen liegen in der Verantwortung der Unternehmen und werden aenderungsprotokolliert
    vat: Die deutsche Matrix fuer MwSt.-Geschaefts- und MwSt.-Produktbuchungsgruppen sowie die MwSt.-Berichterstattung muessen konzipiert und steuerfachlich geprueft werden
    electronicInvoicing: XRechnung, Peppol und ZUGFeRD sind erst Zielformate, nachdem die playthru-Version und die installierten Apps nachgewiesen wurden
    payments: SEPA-Export mit Trennung von Ersteller und Genehmiger; die Uebertragung ueber das Bankportal bleibt ausserhalb des Business-Central-Nachweises
    reporting: Zuerst Financial Reports und Analysis Views; Power BI wird bis zur Abstimmung und Klaerung der semantischen Verantwortung zurueckgestellt
masterDataStrategy:
  sourceIds: [SRC-BC-019]
  principle: Zentrale Steuerung bedeutet nicht identische Datensaetze in jedem BC-Unternehmen.
  sourceCompany: UAM-DE
  sharedCandidates: [Dimensionscodes und -werte, Zahlungsbedingungen, Mengeneinheiten, Artikelkategorien, ausgewaehlte Identitaetsfelder von Geschaeftspartnern]
  companySpecific: [Buchungsgruppen, Bankkonten, Kreditlimits, Preise, Steuerregistrierungen, Lagerorte, Planungsparameter, Einkaufskonditionen fuer Kreditoren]
  synchronizationConstraint: Die Standardsynchronisierung zieht Daten innerhalb einer Umgebung unidirektional; bidirektionale Synchronisierung wird ausgeschlossen.
  commercialMasterPolicy: UAM-DE verantwortet Parteistammdaten, gemeinsame Wörterbücher und den synchronisierten kommerziellen Artikelkern.
  productMasterRecommendation: UAS-DE ergaenzt den kommerziellen Artikelkern von UAM-DE um lokale, nicht synchronisierte Produktionsstuecklisten, Arbeitsplaene, Kapazitaeten, Konstruktions- und weitere Fertigungsfelder.
  partyMasterRecommendation: P-016 verantwortet Identität und Dublettenvermeidung in UAM-DE; jede Gesellschaft besitzt ihre transaktionalen, gesetzlichen, Kredit-, Preis-, Einkaufs-, Standort- und Planungsfelder.
  activationGate: Vor Aktivierung der Synchronisierung muessen eine Eigentums- und Synchronisierungsmatrix auf Feldebene sowie ein erfolgreicher Machbarkeitsnachweis in playthru vorliegen.
deliveryWorkstreams:
  sourceIds: [SRC-BC-035, SRC-BC-036, SRC-BC-038, SRC-BC-039, SRC-BC-040, SRC-BC-041, SRC-BC-042, SRC-BC-044]
  W1: Strategie, Dateninventar, Verantwortliche, kontrollierte Vorlagen, Testplan, Plan fuer Schulung und Benutzerakzeptanz, lokale Financial Reports und Dimensionspruefungen
  W2: Zuordnung, Bereinigung, Probeladung 1, Einbindung der Schluesselanwender und IC-Beleggrundlage von UAS nach UAD
  W3: Probeladung 2, integrierte Prozesstests, Entwicklung der Schulungsinhalte und Befaehigung der Modul-Schluesselanwender
  W4: UAT-Datenlauf, Abstimmung, fachliche Abnahme, Schulung der Trainer, Umstellungsprobe, vollstaendige IC-Abstimmung und Konzernberichterstattung
  W5: abschliessende Ladung, Endanwenderschulung, Produktivumstellung, intensive Nachbetreuung und gemessener Uebergang in den Unterstuetzungsbetrieb
dataDeliveryModel:
  sourceIds: [SRC-BC-036, SRC-BC-037]
  setupData: Configuration Worksheet und gepruefte Configuration Packages; nur freigegebene Einrichtung mit unternehmensspezifischen Werten und Protokoll des Wiederholungslaufs uebertragen
  masterData: kontrollierter Excel-Austausch und Configuration Packages mit Configuration Templates fuer freigegebene Standardwerte; der Objektverantwortliche prueft Identitaet und Unternehmensfelder
  openEntries: objektspezifische Vorlagen oder Buchungsblaetter mit Belegverknuepfung, Ueberfaelligkeit, Bestandswert und Abstimmung von Nebenbuch zu Hauptbuch
  postedData: keine Massenerzeugung historischer gebuchter Transaktionen ueber Configuration Packages; zugaengliches Altdatenarchiv beibehalten oder nur ausdruecklich freigegebene Eroeffnungspositionen mit pruefungssicherer Abstimmung migrieren
  control: jede Datei und jedes Paket enthaelt Verantwortlichen, Quellauszug, Transformation, Version, Ladereihenfolge, Lauf-ID, Fehlerbehandlung, Abstimmung sowie einen Hinweis zum Zuruecksetzen oder Wiederholen
