  training: P-015 koordiniert; jeder Modul-Schluesselanwender entwickelt und vermittelt die eigene rollenspezifische Schulung
  uat: Prozessverantwortliche nehmen ihren jeweiligen Verantwortungsumfang ab; P-002 koordiniert und P-015 darf keine Module an ihrer Stelle abnehmen
