securityPrinciples:
  - Entra security groups control environment admission and role grouping.
  - BC permission sets grant least privilege and are company-scoped where required.
  - Profiles and Role Centers are usability features, not security controls.
  - SUPER is restricted to sandbox administration and break-glass use.
decisions:
  - { id: UABC-DEC-001, status: proposed, statement: One operational BC company per legal entity plus non-operational UAC-CONS }
  - { id: UABC-DEC-002, status: proposed, statement: Organizational objects exist only for a distinct process or control purpose }
  - { id: UABC-DEC-003, status: proposed, statement: Warehouse complexity differs by location }
  - { id: UABC-DEC-004, status: proposed, statement: COSTCENTER and BUSINESSUNIT are global dimensions }
  - { id: UABC-DEC-005, status: proposed, statement: Standard-first; extensions require a proven gap and separate change }
  - { id: UABC-DEC-006, status: proposed, statement: OpenSpec is normative; Jira and Confluence are collaboration views }
