definitionOfDone:
  - Alle Jira-Akzeptanzkriterien und Lieferergebnisse sind erfuellt und nachgewiesen.
  - Jedes Ticket verweist auf mindestens ein Besprechungstranskript.
  - Genehmigte Istzeit ist vollstaendig Ticket-bezogen, aber kein Budgetlimit wird ohne menschliche Entscheidung behauptet.
  - Daten, Rollen, Schulung, fachlicher Abnahmetest, UAT-Begleitung und Hypercare sind nachvollziehbar dokumentiert.
  - Monatsabschlussprozess wurde in der Sandbox geprobt und Abstimmungen sind dokumentiert; UStVA-Vorschau ist geprueft, ohne Test-, Produktiv- oder ELSTER-Uebermittlung.
  - Projektdokumentation, Schulungsunterlagen und Confluence-Seitenbaum sind uebergeben.
  - Der Projekt-Twin kann alle freigegebenen Werte nur lesend aus dem Projektindex aufloesen.
excludedScope:
  - AL-Entwicklung, eigene Berichte oder Layouts, Integrationen, Power Platform und Dataverse
  - produktive Bankanbindung, PSD2, mehrere Firmen, Waehrungen, Banken oder Lagerorte
  - erweitertes Lager, Chargen, Seriennummern, Varianten- und Attributkomplexitaet ohne fachliche Pflicht, Produktion, Projekte, Service, Anlagenbuchhaltung, Konsolidierung, Intercompany und Lohnabrechnung
  - historische Bewegungsdaten und E-Rechnung
  - Test-, Produktiv- oder ELSTER-Uebermittlung der UStVA und ELSTER-Zugangsdaten
  - Produktivstart, echter Monatsabschluss, Support nach Hypercare und offene oder unbegrenzte Stabilisierungsphase
  - Steuer- oder Rechtsberatung und GoBD-Garantie
  - reale Daten, Geheimnisse oder Authentifizierungsartefakte
  - Lizenz-, Tenant- und sonstige externe Kosten
