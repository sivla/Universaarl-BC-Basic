    exitCriteria:
      - Umfang, Prozesse, Datenvorlagen, Datenqualitaet und Abnahmeplan sind dokumentiert.
      - Zielgesellschaft, Lizenz und Finanz-/Steuerpruefpunkte sind entschieden oder sichtbar blockierend.
    deliverableIds: [UABC-DEL-BCB-001, UABC-DEL-BCB-002, UABC-DEL-BCB-003]
  - id: UABC-PHASE-02
