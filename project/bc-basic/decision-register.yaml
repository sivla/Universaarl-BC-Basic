  - { id: UABC-DEC-BCB-001, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Genau eine synthetische Gesellschaft in playthru wird verwendet. }
  - { id: UABC-DEC-BCB-002, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Der Lieferumfang folgt dem Standard vor Anpassung und schliesst Erweiterungen sowie Integrationen aus. }
  - { id: UABC-DEC-BCB-003, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Das Projekt besteht aus circa drei Kalenderwochen Vorbereitung, Anforderungen und Datenbereitschaft, genau fuenf aufeinanderfolgenden Einrichtungsarbeitstagen und circa zwei Kalenderwochen begrenzter Stabilisierungsphase; konkrete Kundentermine sind offen. }
  - { id: UABC-DEC-BCB-004, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: 76 Stunden sind geplant und 4 Stunden Reserve bilden die harte Obergrenze von 80 Stunden. }
  - { id: UABC-DEC-BCB-005, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Nur genehmigte Jira-Istzeiten auf unterster Ticketebene werden woechentlich zu 120 EUR netto pro Stunde abgerechnet; Elternsummen sind nicht zusaetzlich abrechenbar. }
  - { id: UABC-DEC-BCB-006, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Die UStVA wird nur als Vorschau und optionales XML geprueft und niemals echt uebermittelt. }
  - { id: UABC-DEC-BCB-007, status: decided, decidedAt: 2026-07-11, decidedByRef: real-repository-user, statement: Der Projekt-Twin ist eine rein lesende Darstellung des Blueprint-Projektindex. }
