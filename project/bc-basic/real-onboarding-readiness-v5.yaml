realGates:
  - id: UABC-GATE-LIVE-TENANT
    ownerRole: Entscheidungslücke – Kundenverantwortung für Tenant zu benennen
    evidenceType: real-tenant
    evidencePath: evidence/real/tenant-access-readback.yaml
    escalationLogic: Ohne benannten Kundenowner und Readback bis zur Entscheidung bleibt das Gate pending und wird an die Kundenprojektleitung eskaliert.
    closureLogic: Nur ein signierter Readback mit Tenant-ID, Zugriffsrolle und Prüfzeitpunkt schließt das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Ein realer Zieltenant ist identifiziert, zugänglich und durch unabhängigen Readback nachgewiesen.
    nextAction: Kundenverantwortung benennen und Tenant-Readback-Termin festlegen.
  - id: UABC-GATE-LIVE-LICENSES
    ownerRole: Entscheidungslücke – Lizenzverantwortung zu benennen
    evidenceType: real-licenses
    evidencePath: evidence/real/licensing-assignment.yaml
    escalationLogic: Fehlende Lizenzverantwortung wird an die Kundenprojektleitung eskaliert; synthetische Produktbeispiele zählen nicht.
    closureLogic: Nur ein gebundener Lizenznachweis mit Benutzer-/Rollenbezug schließt das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Lizenzumfang und Zuweisung sind im Zieltenant mit belastbarer Evidence bestätigt.
    nextAction: Lizenzverantwortung und Prüftermin festlegen; keine Lizenzannahme aus der Simulation ableiten.
  - id: UABC-GATE-LIVE-SECURITY
    ownerRole: Entscheidungslücke – Kundenrolle für Security-Freigabe zu benennen
    evidenceType: real-permissions
    evidencePath: evidence/real/security-permission-review.yaml
    escalationLogic: Offene Security-Owner-Entscheidung bleibt pending und wird an Kundenprojektleitung und Security-Verantwortung eskaliert.
    closureLogic: Nur ein realer Permission-/SoD-Review mit Freigabe und Rückfallpfad schließt das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Rollen, Permission Sets, SoD und Notfallzugang sind real geprüft und freigegeben.
    nextAction: Security-Owner benennen und Permission-/SoD-Prüfung terminieren.
  - id: UABC-GATE-LIVE-UAT
    ownerRole: Entscheidungslücke – fachliche UAT-Verantwortung zu benennen
    evidenceType: real-uat
    evidencePath: evidence/real/uat-signoff.yaml
    escalationLogic: Fehlender UAT-Owner oder Termin wird als Entscheidungslücke an die Kundenprojektleitung eskaliert.
    closureLogic: Nur UAT-Protokoll, Defect-/Retestliste und fachlicher Sign-off im realen Tenant schließen das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Fachliche UAT-Fälle sind im realen Tenant ausgeführt, defects geschlossen und signiert.
    nextAction: UAT-Owner und Key-User benennen; reale Testdaten und Termin abstimmen.
  - id: UABC-GATE-LIVE-CUTOVER
    ownerRole: Entscheidungslücke – Cutover-Verantwortung zu benennen
    evidenceType: real-cutover
    evidencePath: evidence/real/cutover-rehearsal-and-signoff.yaml
    escalationLogic: Ohne benannten Cutover-Owner bleibt das Gate pending und wird an Kundenprojektleitung und Betriebsverantwortung eskaliert.
    closureLogic: Nur Runbook, Freeze, Rückfallpunkt, Rehearsal und reale Exit-Freigabe schließen das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Cutover-Runbook, Freeze, Rückfallpunkt und reale Ausführung sind nachgewiesen.
    nextAction: Cutover-Owner benennen und Entry-/Exit-Entscheidung vorbereiten.
  - id: UABC-GATE-LIVE-CLOSE
    ownerRole: Entscheidungslücke – Finanzabschlussverantwortung zu benennen
    evidenceType: real-first-close
    evidencePath: evidence/real/first-close-reconciliation.yaml
    escalationLogic: Fehlender Finanz-Owner wird an Kundenprojektleitung und Finanzverantwortung eskaliert.
    closureLogic: Nur realer Monatsabschluss mit Abstimmung, Kontrollsummen und Kundenentscheidung schließt das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Erster realer Monatsabschluss ist abgestimmt und durch die Kundenfinanzrolle freigegeben.
    nextAction: Finanz-Owner benennen und ersten realen Abschlussmonat festlegen.
  - id: UABC-GATE-LIVE-TAX
    ownerRole: Entscheidungslücke – Steuerverantwortung zu benennen
    evidenceType: real-vat-submission
    evidencePath: evidence/real/vat-localization-and-submission.yaml
    escalationLogic: Steuer-/Lokalisierungsentscheidung bleibt offen und wird an die benannte Kundensteuerrolle eskaliert.
    closureLogic: Nur reale Lokalisierungsprüfung und autorisierte UStVA-/Übermittlungsevidence schließen das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Lokalisierung, UStVA und gegebenenfalls externe Übermittlung sind real geprüft und autorisiert.
    nextAction: Steuer-Owner und Lokalisierungsentscheid benennen; keine synthetische Vorschau als Übermittlung werten.
  - id: UABC-GATE-LIVE-SUPPORT
    ownerRole: Entscheidungslücke – Supportverantwortung zu benennen
    evidenceType: real-support-handover
    evidencePath: evidence/real/support-sla-handover.yaml
    escalationLogic: Fehlende Supportverantwortung wird an Kundenprojektleitung und Betriebsverantwortung eskaliert.
    closureLogic: Nur bestätigte Kanäle, SLA, Bereitschaft und reale Übergabe schließen das Gate.
    due: null
    dueStatus: entscheidungsluecke
    status: pending
    completionCondition: Reale Supportkanäle, SLA, Bereitschaft und Übergabe sind mit Kundenbestätigung belegt.
    nextAction: Support-Owner benennen und Übergabe-/SLA-Termin abstimmen.
