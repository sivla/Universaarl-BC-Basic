schemaVersion: 1
packageId: UABC-DATA-BCB-001
projectId: UABC-BC-BASIC-001
status: template
classification: synthetic-only
companyRef: UABC-BASIC-DE
prohibitedContent:
  - reale Personen-, Kunden-, Lieferanten-, Bank- oder Steuerdaten
  - Zugangsdaten, Tokens, Authentifizierungszustaende oder Browserprofile
  - reale .env-Dateien, Logs, Videos oder Laufzeitnachweise
deliveryFormat: kontrolliertes Business-Central-Konfigurationspaket als bevorzugter Weg; UTF-8-CSV nur als Quellvorlage oder Export-/Pruefformat
providerOwnerRef: P-002
customerSourceRefs: [P-005, P-011, P-016, P-019]
customerTemplateRoot: project/bc-basic/customer-templates
readinessCheckPath: project/bc-basic/data-readiness-check.yaml
uatCatalogPath: project/bc-basic/uat-catalog.yaml
dataCategories:
  einrichtungsdaten: Konten, Buchungsgruppen, MwSt.-Einrichtung, Dimensionen, Zahlungsbedingungen, Nummernserien und Lagerortvorbereitung.
  stammdaten: Debitoren, Kreditoren, Artikel, Einheiten, Preise, einfache Rabatte und Bankkonten als Stammdaten.
  offenePosten: kontrollierte offene Debitoren-/Kreditorenposten nur, wenn sie fuer Abstimmung und Sandbox-Test erforderlich sind.
  gebuchteDaten: kein historischer Vollimport gebuchter Bewegungsdaten; gebuchte Testdaten entstehen spaeter nur im autorisierten Pflichtszenario.
configurationPackages:
  - id: UABC-CONFIGPKG-BCB-SETUP-001
    namePattern: BCB-SETUP-v001
    category: einrichtungsdaten
    purpose: minimale Grundeinrichtung reproduzierbar vorbereiten, soweit Business Central die Felder sinnvoll per Konfigurationspaket verarbeitet
    candidateTables:
      - { table: Sachkonto, rationale: SKR04-Konten nach fachlicher Freigabe }
      - { table: Allgemeine-Geschaeftsbuchungsgruppe, rationale: grundlegende Inland-Buchungslogik }
      - { table: Allgemeine-Produktbuchungsgruppe, rationale: grundlegende Produkt-Buchungslogik }
      - { table: MwSt.-Geschaeftsbuchungsgruppe, rationale: deutsche MwSt.-Geschaeftsgruppen }
      - { table: MwSt.-Produktbuchungsgruppe, rationale: deutsche MwSt.-Produktgruppen }
      - { table: "Dimension", rationale: minimale Standarddimensionen }
      - { table: "Dimension Value", rationale: freigegebene Dimensionswerte }
      - { table: "Payment Terms", rationale: einfache Zahlungsbedingungen }
      - { table: "Location", rationale: genau ein Lagerort HAUPT }
    requiredFieldRule: Nummer, Code, Beschreibung, Buchungsgruppenbezug, gesperrt-Kennzeichen und synthetische Nachvollziehbarkeit muessen je Tabelle in der Feldliste bestaetigt werden.
    excludedFieldRule: Systemfelder, FlowFields, berechnete Salden, Benutzer-/Auditfelder, echte Bank-/Steuerkennungen und nicht verstandene Felder werden ausgeschlossen.
    dependencies: [Finanz- und Steuerdesign freigegeben, Zielgesellschaft autorisiert]
    importOrder: [Dimensionen, Dimensionswerte, Konten, Buchungsgruppen, MwSt.-Gruppen, Zahlungsbedingungen, Lagerort]
  - id: UABC-CONFIGPKG-BCB-MASTER-001
    namePattern: BCB-MASTER-v001
    category: stammdaten
    purpose: wenige realitaetsnahe Stammdaten fuer Pflichtprozesse laden
    candidateTables:
      - { table: Debitor, rationale: ein synthetischer Debitor }
      - { table: Kreditor, rationale: ein synthetischer Kreditor }
      - { table: Artikel, rationale: wenige synthetische Handelsartikel }
      - { table: Artikeleinheit, rationale: Basiseinheiten fuer Artikel }
      - { table: Verkaufspreis-oder-Preisliste, rationale: einfache Preise und Rabatte, sofern im Zielsystem passend verfuegbar }
      - { table: Bankkonto, rationale: Bankkonto als Stammdatensatz ohne produktive Anbindung }
    requiredFieldRule: Nummer, Name/Beschreibung, Land, Buchungsgruppen, Zahlungsbedingungen, Einheit, Preis/Kosten und synthetische Kennzeichnung muessen gefuellt sein.
    excludedFieldRule: reale IBAN/BIC, personenbezogene Kontaktdaten, Kreditkartendaten, Serien-/Chargenfelder, Varianten-/Attributfelder ohne Pflichtgrund und Integrationsfelder werden ausgeschlossen.
    dependencies: [UABC-CONFIGPKG-BCB-SETUP-001]
    importOrder: [Bankkonto-Stammdaten, Debitoren, Kreditoren, Artikel, Einheiten, Preise und einfache Rabatte]
  - id: UABC-CONFIGPKG-BCB-OPEN-001
    namePattern: BCB-OPEN-v001
    category: offenePosten
    purpose: kontrollierte Anfangs- und offene Posten fuer Abstimmung vorbereiten, ohne historischen Vollimport zu behaupten
    candidateTables:
      - { table: Buchblattzeile, rationale: Eroeffnungsbuchung und einfache offene Posten, falls fachlich freigegeben }
      - { table: Artikelbuchblattzeile, rationale: Anfangsbestand fuer Lagerort HAUPT, falls fachlich freigegeben }
    requiredFieldRule: Buchungsdatum, Belegnummer mit SYN-Praefix, Konto-/Artikelbezug, Betrag/Menge, Dimensionen und synthetische Kennzeichnung muessen gefuellt und abgestimmt sein.
    excludedFieldRule: bereits gebuchte historische Bewegungsdaten, echte Rechnungsnummern, Banktransaktionen, Steuererklaerungsdaten und produktive Zahlungsdateien werden ausgeschlossen.
    dependencies: [UABC-CONFIGPKG-BCB-SETUP-001, UABC-CONFIGPKG-BCB-MASTER-001, fachliche Abstimmung]
    importOrder: [Eroeffnungsjournal pruefen, Bestandsjournal pruefen, offene Posten nur nach Abstimmung]
configurationPackageCustomerRule: Konfigurationspakete bleiben ein Werkzeug des Dienstleisters; Kundinnen und Kunden liefern, pruefen und genehmigen ausschliesslich die kontrollierten Datenvorlagen und muessen Konfigurationspakete weder pflegen noch bedienen.
validationAndRecovery:
  expectedErrors:
    - { symptom: Pflichtfeld fehlt, likelyCause: Kundenvorlage unvollstaendig, action: Ticket blockieren und korrigierte Daten anfordern }
    - { symptom: unbekannte Buchungsgruppe, likelyCause: Setup-Paket fehlt oder Reihenfolge verletzt, action: Setup-Abhaengigkeit pruefen und Paket erneut in richtiger Reihenfolge anwenden }
    - { symptom: Feld nicht editierbar, likelyCause: berechnetes oder systemgesteuertes Feld, action: Feld aus Paket entfernen und manuellen BC-Schritt dokumentieren }
    - { symptom: Summen stimmen nicht, likelyCause: Datenfehler oder fehlende Gegenbuchung, action: Import stoppen, Abstimmung korrigieren, keine Ausgleichswerte erfinden }
  manualSteps:
    - Unternehmensassistenten, spezielle Einrichtungsmasken, Benutzer-/Berechtigungszuordnung und alle Dialoge mit fachlicher Wirkung werden manuell ueber die UI geplant, wenn Konfigurationspakete sie nicht verlaesslich abdecken.
    - Jede manuelle Ausnahme braucht Zweck, Zielzustand, Pruefschritt und Wiederholungs- oder Bereinigungsstrategie.
  retryStrategy: Pakete werden versioniert, nur aus freigegebenen Vorlagen neu erzeugt und vor Wiederholung gegen bereits vorhandene synthetische IDs geprueft; unklare Teilimporte werden nicht ueberschrieben, sondern zuerst analysiert.
qualityGate:
  ownerRef: P-016
  approverRefs: [P-005, P-011, P-019]
  checks:
    - Pflichtfelder gefuellt und technische IDs eindeutig
    - keine realen oder geheimen Werte
    - Codes entsprechen freigegebenen Laengen und Wertelisten
    - Summen fuer Bestand und Eroeffnung sind separat abgestimmt
    - Fehlerprotokoll ist leer oder mit akzeptierten Ausnahmen versehen
  approvalStatus: open
templates:
  - id: UABC-DATA-TPL-001
    objectId: company-setup
    purpose: Genau eine synthetische Zielgesellschaft eindeutig beschreiben.
    ownerRef: P-005
    format: YAML fuer strukturierte Einrichtungsentscheidungen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/company-setup.blank.yaml
    exampleTemplatePath: project/bc-basic/customer-templates/example/company-setup.example.yaml
    required: [companyId, displayName, countryCode, baseCurrency, fiscalYearStart, language, chartOfAccountsTemplate, locationCode, synthetic, approvalStatus]
    qualityRules: [companyId entspricht UABC-BASIC-DE, countryCode ist DE, baseCurrency ist EUR, genau ein Lagerort ist enthalten, Konten- und Steuerfreigaben bleiben offen, synthetic ist true]
  - id: UABC-DATA-TPL-002
    objectId: dimensions
    purpose: Zwei einfache Auswertungsdimensionen fuer Kostenstelle und Geschaeftsbereich vorbereiten.
    ownerRef: P-005
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/dimensions.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/dimensions.example.csv
    required: [dimensionCode, valueCode, description, blocked, synthetic]
    qualityRules: [Dimension und Wert sind eindeutig, Codes enthalten keine Geheimnisse oder Personendaten, synthetic ist true]
  - id: UABC-DATA-TPL-003
    objectId: customers
    purpose: Einen plausiblen synthetischen Debitor fuer den Verkaufsprozess bereitstellen.
    ownerRef: P-011
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/customers.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/customers.example.csv
    required: [customerNo, name, countryCode, customerPostingGroupCandidate, genBusinessPostingGroupCandidate, vatBusinessPostingGroupCandidate, paymentTermsCode, defaultCostCenter, defaultBusiness, taxDecisionStatus, synthetic]
    qualityRules: [customerNo ist eindeutig, Dimensionswerte existieren, Buchungsgruppen bleiben Kandidaten bis zur Freigabe, taxDecisionStatus ist offen, synthetic ist true]
  - id: UABC-DATA-TPL-004
    objectId: vendors
    purpose: Einen plausiblen synthetischen Kreditor fuer den Einkaufsprozess bereitstellen.
    ownerRef: P-011
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/vendors.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/vendors.example.csv
    required: [vendorNo, name, countryCode, vendorPostingGroupCandidate, genBusinessPostingGroupCandidate, vatBusinessPostingGroupCandidate, paymentTermsCode, defaultCostCenter, defaultBusiness, taxDecisionStatus, synthetic]
    qualityRules: [vendorNo ist eindeutig, Dimensionswerte existieren, Buchungsgruppen bleiben Kandidaten bis zur Freigabe, taxDecisionStatus ist offen, synthetic ist true]
  - id: UABC-DATA-TPL-005
    objectId: items
    purpose: Einen synthetischen Handelsartikel fuer Einkauf, Verkauf und einfachen Bestand bereitstellen.
    ownerRef: P-019
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/items.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/items.example.csv
    required: [itemNo, description, baseUnit, inventoryPostingGroupCandidate, genProductPostingGroupCandidate, vatProductPostingGroupCandidate, costingMethod, unitCost, unitPrice, defaultCostCenter, defaultBusiness, taxDecisionStatus, synthetic]
    qualityRules: [itemNo ist eindeutig, unitCost bleibt 42.00, unitPrice bleibt 79.00, Buchungsgruppen bleiben Kandidaten bis zur Freigabe, taxDecisionStatus ist offen, synthetic ist true]
  - id: UABC-DATA-TPL-006
    objectId: inventory-opening
    purpose: Einen kontrollierten synthetischen Anfangsbestand fuer genau einen Lagerort vorbereiten.
    ownerRef: P-019
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/inventory-opening.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/inventory-opening.example.csv
    required: [postingDate, itemNo, locationCode, quantity, unitCost, lineAmount, documentNo, costCenter, business, synthetic]
    qualityRules: [locationCode ist HAUPT, Artikelnummer existiert, lineAmount entspricht quantity mal unitCost, Belegnummer beginnt mit SYN-, Dimensionswerte existieren, synthetic ist true]
  - id: UABC-DATA-TPL-007
    objectId: gl-opening
    purpose: Eine ausgeglichene synthetische Eroeffnungsbuchung ohne reale Bank- oder Steuerwerte vorbereiten.
    ownerRef: P-005
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/gl-opening.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/gl-opening.example.csv
    required: [postingDate, accountRole, accountNoCandidate, debitAmount, creditAmount, documentNo, costCenter, business, approvalStatus, synthetic]
    qualityRules: [Sollsumme entspricht Habensumme, accountNoCandidate bleibt bis zur SKR04-Freigabe leer, Sammelkontenrollen stimmen mit den offenen Posten ab, keine reale Bankverbindung, Belegnummer beginnt mit SYN-, synthetic ist true]
  - id: UABC-DATA-TPL-008
    objectId: open-customer-vendor-entries
    purpose: Je einen synthetischen offenen Debitoren- und Kreditorenposten fuer die Abstimmung vorbereiten.
    ownerRef: P-005
    format: UTF-8-CSV mit Semikolon als Trennzeichen
    approvalStatus: open
    blankTemplatePath: project/bc-basic/customer-templates/blank/open-customer-vendor-entries.blank.csv
    exampleTemplatePath: project/bc-basic/customer-templates/example/open-customer-vendor-entries.example.csv
    required: [accountType, accountNo, documentType, documentNo, postingDate, dueDate, amount, currencyCode, costCenter, business, synthetic]
    qualityRules: [Debitor und Kreditor existieren, Nebenbuchsumme entspricht der zugeordneten Sammelkontenrolle, Belegnummer beginnt mit SYN-, currencyCode ist EUR, Dimensionswerte existieren, keine realen Rechnungsnummern, synthetic ist true]
