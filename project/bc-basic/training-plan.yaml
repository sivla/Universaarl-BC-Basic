customerCompletionGate: Jede benannte Rolle hat ihre zugeordneten UAT-Faelle und Uebungen selbst ausgefuehrt offene Fragen sind geklaert und der Kompetenzcheck ist durch Trainer und Teilnehmerrolle bestaetigt.
completionRule: Ausfuehrungstranskript, Anwesenheit, Uebungsergebnis, offene Fragen und Kompetenzpruefung sind je Termin erforderlich; Planungsnachweise ersetzen diese Angaben nicht. Schulung zur Erstellung oder Pflege von Konfigurationspaketen ist ausgeschlossen.
learningPath:
  - { sequence: 1, audience: alle Rollen, outcome: Navigation Zielgesellschaft Sicherheits- und Supportweg beherrschen }
  - { sequence: 2, audience: Prozessrollen, outcome: eigene Standardbelege erfassen Fehler erkennen und Entries nachverfolgen }
  - { sequence: 3, audience: Finance und Kontrolle, outcome: Zahlung Abstimmung Abschluss und VAT-Vorschau kontrollieren }
  - { sequence: 4, audience: alle Abnehmer, outcome: zugeordnete UAT-Faelle ohne Anleitung wiederholen und Cutoverbereitschaft bestaetigen }
operatorRoutines:
  - { roleRef: P-004, daily: Zielgesellschaft Arbeitsdatum Rolle und Systemhinweise kontrollieren, weekly: Benutzerzugang Nummernserien Buchungszeitraum und Supportfaelle pruefen, monthly: Rollenliste Berechtigungsabweichungen und Periodenwechsel abstimmen, boundary: keine fachliche Buchung oder Freigabe }
  - { roleRef: P-005, daily: Journale faellige Posten Zahlungseingaenge und Buchungsfehler kontrollieren, weekly: Debitoren Kreditoren Bank und Abstimmungsdifferenzen pruefen, monthly: Sachkonto Nebenbuecher Bank Lager VAT und Periode abstimmen, boundary: keine Steuerentscheidung oder externe Uebermittlung }
  - { roleRef: P-011, daily: Bestellungen Wareneingaenge Auftraege Lieferungen Rechnungen und ueberfaellige Posten bearbeiten, weekly: Preis Mengen Liefer- und Rechnungsabweichungen pruefen, monthly: offene Einkaufs-und-Verkaufsbelege mit Finance abstimmen, boundary: keine Setupwerte eigenmaechtig aendern }
  - { roleRef: P-019, daily: Artikelverfuegbarkeit Lagerort Mengen und Lagerfehler kontrollieren, weekly: negative Bestaende Bewegungen und Inventurdifferenzen pruefen, monthly: Zaehlliste Item-und-Value-Entries sowie Lagerwert abstimmen, boundary: keine Finanz-oder-Bewertungsparameter aendern }
escalationOutcomes:
  - { sequence: 1, outcome: selbst-korrigieren, useWhen: eindeutiger reversibler Eingabefehler vor Buchung in eigener Rolle, requiredAction: korrigieren erneut pruefen und Retest dokumentieren }
  - { sequence: 2, outcome: Key-User, useWhen: Prozessfrage oder bekannte Ausnahme ohne unerklaerte Buchungswirkung, requiredAction: Beleg anhalten und Key User mit Belegnummer Befund und Screenshot informieren }
  - { sequence: 3, outcome: Consultant-Support, useWhen: Setup Berechtigung wiederholter Fehler oder unklare Entry-Kette, requiredAction: Diagnosepaket gemaess UABC-UAT-RUN-BCB-001 uebergeben }
  - { sequence: 4, outcome: sofortiger-Buchungsstopp, useWhen: falsche Gesellschaft Periode unerklaerbare Soll-Haben-VAT-Bestandswirkung oder Datenschutzgefahr, requiredAction: nicht buchen Zustand sichern und P-002 sowie P-005 eskalieren }
