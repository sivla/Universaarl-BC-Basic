ticketTruthNote: Genau UABC-1, UABC-2 und UABC-3 sind Phase-Roots. Typmengen und fakturierbare Tasks werden dynamisch aus der kanonischen Projektstory gelesen; nur reale Task-Worklogs erzeugen Iststunden und Istkosten. Historische Identitaeten bleiben nicht zaehlende Provenienz.
rollupRule:
  scope: current-task-rollup-only
  parentTickets: [UABC-1, UABC-2, UABC-3]
  treatment: nicht abrechenbare Plan- und Fortschrittssummen
  noDoubleBilling: Elternsummen und untergeordnete Arbeitsprotokolle duerfen niemals gemeinsam abgerechnet werden.
weeklyBillingRule:
  cadence: ISO-Woche
  eligibleWhen:
    - Jira-Ticket auf unterster Ebene hat billable true.
    - Das Jira-Arbeitsprotokoll beschreibt tatsaechlich geleistete Arbeit, ist einem Jira-Key zugeordnet und fachlich genehmigt.
    - Das Jira-Arbeitsprotokoll ist noch keiner Rechnung zugeordnet.
  calculation: Summe genehmigter, nicht fakturierter Task-Iststunden der Woche mal 120 EUR netto
  excluded:
    - Schaetzungen und Elternsummen
    - Eltern-, Epic- und Storysummen sowie jede doppelte Zuordnung desselben Arbeitsprotokolls
    - Kundenaufwaende
    - nicht entschiedenes Budgetlimit
    - abgelehnte, doppelte oder nicht einem Jira-Key zugeordnete Zeiten
    - externe Kosten
  invoiceLineFields: [jiraKey, summary, workDate, approvedHours, hourlyRate, netAmount, approverRef]
  budgetStop: Kein Budgetstop ohne menschlich entschiedenes Budgetlimit; Planstunden und Iststunden werden getrennt berichtet.
worklogContract:
  systemOfRecord: Jira
  required: [worklogId, jiraKey, personRef, workDate, isoWeek, hours, billable, approvalStatus, approverRef, invoiceRef]
  allowedApprovalStatus: [draft, submitted, approved, rejected]
  initialActualHours: 0
  uniquenessRule: Jede worklogId darf genau einmal und nur einem Jira-Key auf unterster Ebene zugeordnet sein.
  parentAggregation: Elternwerte werden ausschliesslich aus untergeordneten Arbeitsprotokollen berechnet und erzeugen keine Rechnungszeile.
worklogs: []
invoices: []
