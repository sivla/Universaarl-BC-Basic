packageWaves:
  - waveId: UABC-01-CORE-FINANCE
    name: Kern und Finanzwesen
    sequence: 1
    state: skeleton-only
    entry: Zielgesellschaft gebunden; Country/Region-Abhaengigkeit sichtbar; Schreibscope und Reset geklaert.
    scope: Company Information nach Seed, General Ledger Setup, Posting/VAT, Nummernserien, Zahlungsbedingungen/-methoden und Dimensionen; keine Bankkonten oder Bankbaseline in CORE.
    exit: Alle aufgenommenen Tabellen und Felder sind fachlich freigegeben, referenziell gueltig und feldnah geprueft.
    ownerRef: P-PILOT-LEAD-001
    validation: Keine Tabelle vor freigegebener Abhaengigkeitsmatrix; aktuell 0 Tabellen und keine Setupwirkung.
    defectRetestRef: UABC-DEF-PILOT-001
  - waveId: UABC-02-TRADE-MASTER
    name: Handel und Stammdaten
    sequence: 2
    state: skeleton-only
    entry: CORE-FINANCE Exit bestanden; Buchungsgruppen, VAT, Zahlungslogik, Dimensionen und Lagerbaseline vorhanden.
    scope: Debitoren, Kreditoren, Artikel, Einheiten, Lagerort, Preise und erlaubtes synthetisches Bankkonto.
    exit: Pflichtfelder, Referenzen, Dubletten, Buchungsgruppen, Lager und Preise sind abgestimmt.
    ownerRef: P-PILOT-LEAD-001
    validation: Aktuell 0 Tabellen, 0 Datensaetze und keine Stammdatenwirkung.
    defectRetestRef: null
  - waveId: UABC-03-OPENING-DATA
    name: Eroeffnungs- und offene Daten
    sequence: 3
    state: skeleton-only
    entry: TRADE-MASTER Exit bestanden; Stammdaten, Postingsgruppen, Lager und Preise referenziell gueltig.
    scope: Eroeffnungsbilanz, offene Debitoren-/Kreditorenposten und Anfangsbestand nur ueber kontrollierte Journals und Buchungen.
    exit: Soll/Haben, Nebenbuch/Sachbuch, Menge/Wert und offene Posten sind differenzfrei abgestimmt.
    ownerRef: P-PILOT-LEAD-001
    validation: Gebuchte Ledger-Tabellen sind im Paket verboten; aktuell 0 Tabellen, 0 Datensaetze und keine Buchungswirkung.
    defectRetestRef: null
