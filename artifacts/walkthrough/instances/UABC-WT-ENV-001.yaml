history:
  - { at: 2026-07-10, actor: P-002, action: aus archivierten Baseline-Nachweisen erstellt }
audiences: [neue Business-Central-Anwender, Implementierungsberater, Nachweispruefer]
playbackModes:
  beginner: { secondsPerStep: 6, emphasis: verstaendliche Bedienung und Kontext }
  consultant: { secondsPerStep: 4, emphasis: fachliche Begruendung und Konfigurationswirkung }
  evidence-review: { secondsPerStep: 5, emphasis: Provenienz-IDs und beobachtbarer Zustand }
learningObjective: Die Zielumgebung, aktive Gesellschaft und sichtbare technische Baseline sicher erkennen, ohne Gesellschaft zu wechseln oder Business-Central-Daten zu veraendern.
prerequisites:
  - Archivierte und verifizierte playthru-Umgebungsbaseline
  - Nur lesende Betrachtung; kein Gesellschafts- oder Umgebungswechsel
  - Kenntnis, dass Experience und vollstaendige App-/Feature-Inventare unknown beziehungsweise partial bleiben
steps:
  - sequence: 1
    stepId: ENV-00
    title: Zielgrenze erkennen
    bcSurface: Rollencenter-Kopfbereich
    userAction: Die lokal konfigurierte playthru-URL ohne company-Parameter oeffnen und den Kopfbereich lesen.
    expectedResult: Umgebung playthru und aktive Gesellschaft CRONUS DE sind sichtbar.
    businessRationale: Vor jeder spaeteren Aktion muss die technische Umgebung und aktive Buchungsgrenze zweifelsfrei feststehen.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-00.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-00.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 1. playthru ist die Umgebung; CRONUS DE ist die aktive Gesellschaft.
    safetyNotes: [Keine vollstaendige BC-URL publizieren, Keine Navigation ausserhalb playthru]
  - sequence: 2
    stepId: ENV-01
    title: Zugaengliche Gesellschaften lesen
    bcSurface: Seitenbereich Verfuegbare Mandanten
    userAction: Strg+O druecken, den Playthru-Teilbaum lesen und keinen Eintrag auswaehlen.
    expectedResult: CRONUS DE, My Company und Universaarl GmbH sind sichtbar; CRONUS DE bleibt markiert.
    businessRationale: Die sichtbare Zugriffsliste wird getrennt von Existenzannahmen und ohne unbeabsichtigten Gesellschaftswechsel dokumentiert.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-01.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-01.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 2. Die sichtbare Mandantenliste wird gelesen, ohne eine Gesellschaft zu wechseln.
    safetyNotes: [Nicht auf einen Mandantennamen klicken, Nichtbeobachtung beweist keine Nichtexistenz]
  - sequence: 3
    stepId: ENV-02
    title: Version und Builds lesen
    bcSurface: Hilfe und Support - Problembehebung
    userAction: Hilfe und Support oeffnen und die sichtbare Versionszeile lesen.
    expectedResult: DE Business Central 28.2, Plattform 28.0.52048.0 und Anwendung 28.2.50931.52151 sind sichtbar.
    businessRationale: Version und Builds begrenzen belastbar, welche Sandbox-Fakten spaeter technisch nachgewiesen werden koennen.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-02.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-02.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 3. Hilfe und Support zeigt Client-, Plattform- und Anwendungsversion.
    safetyNotes: [Keine Telemetrie oder zusaetzliche Protokollierung aktivieren]
  - sequence: 4
    stepId: ENV-03
    title: Benutzerkontext unterscheiden
    bcSurface: Meine Einstellungen dialog
    userAction: Alt+T druecken, Mandant, Arbeitsdatum, Region, Sprache und Zeitzone lesen und mit Abbrechen schliessen.
    expectedResult: CRONUS DE, Arbeitsdatum 01.06.2027 sowie German (Germany) fuer Region und Sprache sind sichtbar.
    businessRationale: Arbeitsdatum und Zeitzone beeinflussen den Benutzerlauf, sind aber keine Gesellschaftskonfiguration und duerfen nicht verwechselt werden.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-03.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-03.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 4. Arbeitsdatum und Zeitzone sind Benutzer- und Laufkontext.
    safetyNotes: [Dialog mit Abbrechen verlassen, Kein Arbeitsdatum veraendern]
  - sequence: 5
    stepId: ENV-04
    title: Laender- und Regionscode einordnen
    bcSurface: Firmendaten
    userAction: Unternehmensdaten oeffnen, Laender-/Regionscode lesen und ohne Aenderung zurueckkehren.
    expectedResult: Der sichtbare Code ist DE.
    businessRationale: DE ist ein Lokalisierungskandidat, aber ohne App- und Prozesstest kein Vollnachweis der deutschen Lokalisierung.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-04.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-04.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 5. DE ist sichtbar, bleibt aber nur ein Teilnachweis der Lokalisierung.
    safetyNotes: [Kein Feld bearbeiten, Keine Lokalisierungsverfuegbarkeit ableiten]
  - sequence: 6
    stepId: ENV-05
    title: Sichtbare Extensions begrenzen
    bcSurface: Seitenueberlagerung Installierte Erweiterungen
    userAction: Ueber Tell Me die angebotene Erweiterungsverwaltung oeffnen und nur die sichtbaren Karten lesen.
    expectedResult: Sechs Karten mit im Viewport sichtbarem Namen und Herausgeber bilden eine unvollstaendige Teilmenge.
    businessRationale: Ein screenshot-belegter Ausschnitt verhindert, dass gerenderte Elemente ausserhalb des Viewports als visuell geprueft gelten.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-05.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-05.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 6. Nur sechs vollstaendig sichtbare Name-Herausgeber-Paare sind belegt.
    safetyNotes: [Keine Extension-Aktion ausfuehren, Keine Vollinventarisierung behaupten]
  - sequence: 7
    stepId: ENV-06
    title: Funktionsverwaltung lesend pruefen
    bcSurface: Verschachtelte Seite Funktionsverwaltung
    userAction: Ueber Tell Me die Funktionsverwaltung oeffnen und nur viewport-schneidende Zeilen lesen.
    expectedResult: 15 sichtbare Zeilen bilden einen candidate/visible-partial Zustand; keine Funktion wird aktiviert.
    businessRationale: Sichtbare Featurezeilen dokumentieren den Laufzustand, beweisen aber weder Vollstaendigkeit noch allgemeine Featureverfuegbarkeit.
    screenshotRefs: [{ runRef: run-1, path: evidence/playthru-environment-baseline/run-1/env-06.png }, { runRef: run-2, path: evidence/playthru-environment-baseline/run-2/env-06.png }]
    mediaRefs: [walkthrough.webm, preview.webp]
    caption: Schritt 7. Feature Management bleibt read-only und sichtbar unvollstaendig.
    safetyNotes: [Liste nicht bearbeiten, Keine Aktivierung oder Datenaktualisierung ausloesen]
securityAndRedaction: { noSecrets: true, noFullBcUrl: true, personalData: Screenshots wurden visuell geprueft; identitaetsbezogene Inhalte wurden ausgeschlossen oder maskiert, rawArtifactsTracked: false }
