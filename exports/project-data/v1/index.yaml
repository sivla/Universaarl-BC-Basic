  - Ein deklarierter selector begrenzt den lesbaren Ausschnitt einer gemeinsam genutzten Datei und ist verbindlich.
  - Verweise, Links und relative Pfade innerhalb einer Quelle erlauben keine zusaetzlichen, nicht positivgelisteten Lesezugriffe.
  - Der Index enthaelt keine duplizierte fachliche Wahrheit; Werte werden aus den referenzierten Quellen aufgeloest.
  - Fehlende, unlesbare oder nicht freigegebene Werte bleiben leer und werden weder erfunden noch aus einer zweiten Quelle ergaenzt.
  - Konsumenten duerfen weder Blueprint-Quellen noch eigene Projektinhalte schreiben.
  - Pfade zu .env-Dateien, Authentifizierungszustaenden, Geheimnissen, Browserprofilen, Logs, Videos und rohen Laufzeitnachweisen sind unzulaessig.
