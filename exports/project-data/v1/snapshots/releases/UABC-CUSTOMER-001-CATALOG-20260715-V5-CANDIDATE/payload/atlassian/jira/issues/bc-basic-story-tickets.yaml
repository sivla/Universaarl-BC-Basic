      Entscheidungsverantwortung und Fälligkeit, die Aktion Projektfreigabe und
      Fit-to-Standard-Entscheidung dokumentieren, Beleg-/Postenwirkungen,
      Kontrollsumme, Ausnahme, Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext prozessbild umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Unternehmen, Verantwortung, Umfang,
