      Korrektur und Retest. Ablaufmerkmal fachanker-w.


      Ergebnis und Akzeptanz

      Verkauf einrichten liefert fuer o2c ein pruefbares Ergebnis. 10 STK mal
      79,00 ergeben 790,00 netto, 150,10 Umsatzsteuer und 940,10 Debitor.
      Akzeptiert wird ausschliesslich der synthetische Simulationsnachweis nach
      Prüfung durch die benannten Rollen; eine reale Kundensystemabnahme wird
