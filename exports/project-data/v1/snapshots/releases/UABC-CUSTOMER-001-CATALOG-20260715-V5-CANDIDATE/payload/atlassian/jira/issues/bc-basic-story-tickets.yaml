    summary: Projektstart
    description: >-
      Ausgangslage und Ziel

      Projektstart (UABC-1) beginnt im Arbeitskontext projektstart erst am
      2026-04-10. Ausgangslage ist der ausdrücklich simulierte Beispielkunde
      Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Projektsteuerung-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer projektstart werden Unternehmensinformationen / Meine Einstellungen /
      Projektdokumentation, die Felder Unternehmen, Verantwortung, Umfang,
      Entscheidungsverantwortung und Fälligkeit, die Aktion Projektfreigabe und
      Fit-to-Standard-Entscheidung dokumentieren, Beleg-/Postenwirkungen,
      Kontrollsumme, Ausnahme, Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext projektstart umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Unternehmen, Verantwortung, Umfang,
      Entscheidungsverantwortung und Fälligkeit. Simulierte Verantwortung: Dr.
      Lena Hartmann (Geschaeftsfuehrerin, Sponsorin), Verfuegbarkeit Dienstag
      und Donnerstag 09:00-12:00; simuliert. Beratung: Kajetan Kalicki als reale
      Universaarl-Projektleitung und leitender BC-Berater. Pruefkontext
      fachanker-a.


      Durchführung

      Unternehmensinformationen / Meine Einstellungen / Projektdokumentation
      ueber Suche oeffnen; Unternehmen, Verantwortung, Umfang,
      Entscheidungsverantwortung und Fälligkeit gegen die freigegebene Baseline
      lesen; Projektfreigabe und Fit-to-Standard-Entscheidung dokumentieren;
      erzeugte Belege und Posten per Navigate oder Drill-down kontrollieren;
      Abweichung protokollieren; Korrektur anwenden; denselben Fall mit
      identischen Eingaben retesten. Die Agenda aus UABC-MTG-001, UABC-MTG-004
      bindet projektstart an Eingabe, BC-Seite, Feld, Aktion, Ergebnis,
      Kontrolle, Abweichung, Korrektur und Retest. Ablaufmerkmal fachanker-a.


      Ergebnis und Akzeptanz

      Projektstart liefert fuer project ein pruefbares Ergebnis. Scope, RACI,
      Budget und Gateentscheidung sind nachvollziehbar verknuepft. Akzeptiert
      wird ausschliesslich der synthetische Simulationsnachweis nach Prüfung
      durch die benannten Rollen; eine reale Kundensystemabnahme wird nicht
      behauptet.


      Lieferung und Referenzen

      projektstart liefert Phase 1 – Vorbereitung und Datenbereitschaft.
      Transkript UABC-MTG-001, UABC-MTG-004, Nachweis
      evidence/playthru-uabc-basic-de/setup-wave-1-read-only-preflight.yaml,
      evidence/playthru-uabc-basic-de/setup-wave-1-control-center-run-plan.yaml,
      project/bc-basic/pilot-setup-baseline.yaml und Seiten
      atlassian/confluence/pages/80-bc-basic-project-overview.md bleiben
      bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-a auf Unternehmensinformationen / Meine
      Einstellungen / Projektdokumentation: Unternehmen, Verantwortung, Umfang,
      Entscheidungsverantwortung und Fälligkeit. Scope, RACI, Budget und
      Gateentscheidung sind nachvollziehbar verknuepft. Eine relevante
      Abweichung wurde erfasst, fachlich korrigiert und mit unveraenderter
      Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Dieses Eltern-Ticket ist nicht fakturierbar; Iststunden und Kosten werden
      ausschliesslich aus den untergeordneten Aufwandsnachweiss hochgerollt.
      Plan und Ist werden getrennt ausgewiesen; Abrechnungsmerkmal fachanker-a.


      Abhängigkeiten, Risiken und Übergabe

      Risiko projektstart: Im Arbeitskontext projektstart kann eine falsche
      Feld- oder Buchungsgruppenzuordnung nachgelagerte project-Kontrollen
      verfaelschen. Gateberechtigung liegt bei Dr. Lena Hartmann nur innerhalb
      der Simulation. Nach bestandenem Retest wird Geprueftes Ergebnis
      projektstart an die untergeordneten beziehungsweise nachfolgenden
      Arbeitspakete uebergeben.
