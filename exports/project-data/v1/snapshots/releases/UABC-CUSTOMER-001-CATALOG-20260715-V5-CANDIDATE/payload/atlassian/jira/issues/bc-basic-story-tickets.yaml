      Ausgangslage und Ziel

      Periodenabschluss (UABC-27) beginnt im Arbeitskontext periodenabschluss
      erst am 2026-05-08. Ausgangslage ist der ausdrücklich simulierte
      Beispielkunde Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Finanzbuchhaltung-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer periodenabschluss werden Finanzbuchhaltung Einrichtung /
      Buchhaltungsperioden / Sachposten, die Felder Buchungen zugelassen ab und
      bis, Geschäftsbuchungsgruppe, Produktbuchungsgruppe und
      USt.-Buchungsmatrix, die Aktion Buchungsvorschau, Navigate und
      Saldenkontrolle prüfen, Beleg-/Postenwirkungen, Kontrollsumme, Ausnahme,
      Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext periodenabschluss umfasst weder Continia noch
      produktive Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Buchungen zugelassen ab und bis, Geschäftsbuchungsgruppe,
      Produktbuchungsgruppe und USt.-Buchungsmatrix. Simulierte Verantwortung:
      Miriam Becker (Leitung Finance, Finance Key User, UAT Lead),
      Verfuegbarkeit Taeglich 09:00-15:00; Monatsende priorisiert; simuliert.
      Beratung: Kajetan Kalicki als reale Universaarl-Projektleitung und
      leitender BC-Berater. Pruefkontext fachanker-aa.


      Durchführung

      Finanzbuchhaltung Einrichtung / Buchhaltungsperioden / Sachposten ueber
      Suche oeffnen; Buchungen zugelassen ab und bis, Geschäftsbuchungsgruppe,
      Produktbuchungsgruppe und USt.-Buchungsmatrix gegen die freigegebene
      Baseline lesen; Buchungsvorschau, Navigate und Saldenkontrolle prüfen;
      erzeugte Belege und Posten per Navigate oder Drill-down kontrollieren;
      Abweichung protokollieren; Korrektur anwenden; denselben Fall mit
      identischen Eingaben retesten. Die Agenda aus UABC-MTG-002 bindet
      periodenabschluss an Eingabe, BC-Seite, Feld, Aktion, Ergebnis, Kontrolle,
      Abweichung, Korrektur und Retest. Ablaufmerkmal fachanker-aa.


      Ergebnis und Akzeptanz

      Periodenabschluss liefert fuer finance ein pruefbares Ergebnis. Soll und
      Haben der Abschlusskontrolle betragen jeweils 11.080,20; Differenz 0,00.
      Akzeptiert wird ausschliesslich der synthetische Simulationsnachweis nach
      Prüfung durch die benannten Rollen; eine reale Kundensystemabnahme wird
      nicht behauptet.


      Lieferung und Referenzen

      periodenabschluss liefert Key User sind befähigt. Transkript UABC-MTG-002,
      Nachweis project/bc-basic/setup-wave-1-matrix.yaml,
      project/bc-basic/setup-parameter-baseline.yaml und Seiten
      atlassian/confluence/pages/80-bc-basic-project-overview.md bleiben
      bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-aa auf Finanzbuchhaltung Einrichtung /
      Buchhaltungsperioden / Sachposten: Buchungen zugelassen ab und bis,
      Geschäftsbuchungsgruppe, Produktbuchungsgruppe und USt.-Buchungsmatrix.
      Soll und Haben der Abschlusskontrolle betragen jeweils 11.080,20;
      Differenz 0,00. Eine relevante Abweichung wurde erfasst, fachlich
      korrigiert und mit unveraenderter Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Dieses Eltern-Ticket ist nicht fakturierbar; Iststunden und Kosten werden
      ausschliesslich aus den untergeordneten Aufwandsnachweiss hochgerollt.
