    summary: Zahlungen prüfen
    description: >-
      Ausgangslage und Ziel

      Zahlungen prüfen (UABC-25) beginnt im Arbeitskontext zahlungen-prüfen erst
      am 2026-05-01. Ausgangslage ist der ausdrücklich simulierte Beispielkunde
      Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Zahlungsausgleich-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer zahlungen-prüfen werden Zahlungsabstimmungsbuchblatt, die Felder
      Transaktionsdatum, Betrag, Belegnummer und Ausgleichsbelegnummer, die
      Aktion automatisch ausgleichen, Zuordnung prüfen und Zahlungen buchen,
      Beleg-/Postenwirkungen, Kontrollsumme, Ausnahme, Korrektur und Retest
      bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext zahlungen-prüfen umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Transaktionsdatum, Betrag, Belegnummer und
      Ausgleichsbelegnummer. Simulierte Verantwortung: Miriam Becker (Leitung
      Finance, Finance Key User, UAT Lead), Verfuegbarkeit Taeglich 09:00-15:00;
      Monatsende priorisiert; simuliert. Beratung: Kajetan Kalicki als reale
      Universaarl-Projektleitung und leitender BC-Berater. Pruefkontext
      fachanker-y.


      Durchführung

      Zahlungsabstimmungsbuchblatt ueber Suche oeffnen; Transaktionsdatum,
      Betrag, Belegnummer und Ausgleichsbelegnummer gegen die freigegebene
      Baseline lesen; automatisch ausgleichen, Zuordnung prüfen und Zahlungen
      buchen; erzeugte Belege und Posten per Navigate oder Drill-down
      kontrollieren; Abweichung protokollieren; Korrektur anwenden; denselben
      Fall mit identischen Eingaben retesten. Die Agenda aus UABC-MTG-008 bindet
      zahlungen-prüfen an Eingabe, BC-Seite, Feld, Aktion, Ergebnis, Kontrolle,
      Abweichung, Korrektur und Retest. Ablaufmerkmal fachanker-y.


      Ergebnis und Akzeptanz

      Zahlungen prüfen liefert fuer payment ein pruefbares Ergebnis. Debitor
      940,10 und Kreditor 499,80 sind jeweils vollstaendig ausgeglichen.
      Akzeptiert wird ausschliesslich der synthetische Simulationsnachweis nach
      Prüfung durch die benannten Rollen; eine reale Kundensystemabnahme wird
      nicht behauptet.


      Lieferung und Referenzen

      zahlungen-prüfen liefert Order-to-Cash ist durchgespielt. Transkript
      UABC-MTG-008, Nachweis project/bc-basic/setup-wave-1-matrix.yaml,
      project/bc-basic/setup-parameter-baseline.yaml und Seiten
      atlassian/confluence/pages/80-bc-basic-project-overview.md bleiben
      bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-y auf Zahlungsabstimmungsbuchblatt:
      Transaktionsdatum, Betrag, Belegnummer und Ausgleichsbelegnummer. Debitor
      940,10 und Kreditor 499,80 sind jeweils vollstaendig ausgeglichen. Eine
      relevante Abweichung wurde erfasst, fachlich korrigiert und mit
      unveraenderter Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Dieses Eltern-Ticket ist nicht fakturierbar; Iststunden und Kosten werden
      ausschliesslich aus den untergeordneten Aufwandsnachweiss hochgerollt.
      Plan und Ist werden getrennt ausgewiesen; Abrechnungsmerkmal fachanker-y.


      Abhängigkeiten, Risiken und Übergabe

      Risiko zahlungen-prüfen: Im Arbeitskontext zahlungen-prüfen kann eine
      falsche Feld- oder Buchungsgruppenzuordnung nachgelagerte
      payment-Kontrollen verfaelschen. Gateberechtigung liegt bei Miriam Becker
      nur innerhalb der Simulation. Nach bestandenem Retest wird Geprueftes
      Ergebnis zahlungen-prüfen an die untergeordneten beziehungsweise
      nachfolgenden Arbeitspakete uebergeben.
