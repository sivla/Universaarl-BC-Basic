    description: >-
      Ausgangslage und Ziel

      UAT planen (UABC-29) beginnt im Arbeitskontext uat-planen erst am
      2026-05-27. Ausgangslage ist der ausdrücklich simulierte Beispielkunde
      Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Qualitätssicherung-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer uat-planen werden Gebuchte Belege / Navigate / Fehlermeldungen, die
      Felder Belegnummer, Buchungsdatum, Restbetrag, offen und
      Dimensionssatz-ID, die Aktion Drilldown, Fehler erfassen, korrigieren und
      identisch erneut testen, Beleg-/Postenwirkungen, Kontrollsumme, Ausnahme,
      Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext uat-planen umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Belegnummer, Buchungsdatum, Restbetrag, offen und
      Dimensionssatz-ID. Simulierte Verantwortung: Miriam Becker (Leitung
      Finance, Finance Key User, UAT Lead), Verfuegbarkeit Taeglich 09:00-15:00;
      Monatsende priorisiert; simuliert. Beratung: Kajetan Kalicki als reale
      Universaarl-Projektleitung und leitender BC-Berater. Pruefkontext
      fachanker-ac.


      Durchführung

      Gebuchte Belege / Navigate / Fehlermeldungen ueber Suche oeffnen;
      Belegnummer, Buchungsdatum, Restbetrag, offen und Dimensionssatz-ID gegen
      die freigegebene Baseline lesen; Drilldown, Fehler erfassen, korrigieren
      und identisch erneut testen; erzeugte Belege und Posten per Navigate oder
      Drill-down kontrollieren; Abweichung protokollieren; Korrektur anwenden;
      denselben Fall mit identischen Eingaben retesten. Die Agenda aus
      UABC-MTG-007 bindet uat-planen an Eingabe, BC-Seite, Feld, Aktion,
      Ergebnis, Kontrolle, Abweichung, Korrektur und Retest. Ablaufmerkmal
      fachanker-ac.


      Ergebnis und Akzeptanz

      UAT planen liefert fuer quality ein pruefbares Ergebnis. Kein offener
      P1/P2; jeder Defect besitzt Ursache, Fix und bestandenen Retest.
      Akzeptiert wird ausschliesslich der synthetische Simulationsnachweis nach
      Prüfung durch die benannten Rollen; eine reale Kundensystemabnahme wird
      nicht behauptet.


      Lieferung und Referenzen

      uat-planen liefert Zahlungsreferenz-Abweichung ist behoben. Transkript
      UABC-MTG-007, Nachweis project/bc-basic/setup-wave-1-matrix.yaml,
      project/bc-basic/setup-parameter-baseline.yaml und Seiten
      atlassian/confluence/pages/80-bc-basic-project-overview.md bleiben
      bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-ac auf Gebuchte Belege / Navigate /
      Fehlermeldungen: Belegnummer, Buchungsdatum, Restbetrag, offen und
      Dimensionssatz-ID. Kein offener P1/P2; jeder Defect besitzt Ursache, Fix
      und bestandenen Retest. Eine relevante Abweichung wurde erfasst, fachlich
      korrigiert und mit unveraenderter Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Dieses Eltern-Ticket ist nicht fakturierbar; Iststunden und Kosten werden
      ausschliesslich aus den untergeordneten Aufwandsnachweiss hochgerollt.
      Plan und Ist werden getrennt ausgewiesen; Abrechnungsmerkmal fachanker-ac.


      Abhängigkeiten, Risiken und Übergabe

      Risiko uat-planen: Im Arbeitskontext uat-planen kann eine falsche Feld-
      oder Buchungsgruppenzuordnung nachgelagerte quality-Kontrollen
      verfaelschen. Gateberechtigung liegt bei Miriam Becker nur innerhalb der
      Simulation. Nach bestandenem Retest wird Geprueftes Ergebnis uat-planen an
      die untergeordneten beziehungsweise nachfolgenden Arbeitspakete
      uebergeben.
