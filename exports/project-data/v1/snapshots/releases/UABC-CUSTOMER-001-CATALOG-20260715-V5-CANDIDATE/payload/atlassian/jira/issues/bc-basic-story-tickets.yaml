    description: >-
      Ausgangslage und Ziel

      Datenworkshop (UABC-32) beginnt im Arbeitskontext datenworkshop erst am
      2026-04-10. Ausgangslage ist der ausdrücklich simulierte Beispielkunde
      Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Datenübernahme-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer datenworkshop werden Konfigurationspakete / Debitoren / Kreditoren /
      Artikel, die Felder Tabellen-ID, Feld-ID, Feldvalidierung, Nummer,
      Buchungsgruppe und Dimension, die Aktion importieren, Paket prüfen, Paket
      anwenden und Fehlerprotokoll lesen, Beleg-/Postenwirkungen, Kontrollsumme,
      Ausnahme, Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext datenworkshop umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Tabellen-ID, Feld-ID, Feldvalidierung, Nummer,
      Buchungsgruppe und Dimension. Simulierte Verantwortung: Nora Schmitt
      (IT-Koordination, Berechtigungsadministration), Verfuegbarkeit Montag bis
      Donnerstag 08:00-16:00; simuliert. Beratung: Kajetan Kalicki als reale
      Universaarl-Projektleitung und leitender BC-Berater. Pruefkontext
      fachanker-af. Datenquellen, Feldlisten, Dateiformate, Daten-Owner und
      Freigabefrist sind verbindlich benannt.


      Durchführung

      Konfigurationspakete / Debitoren / Kreditoren / Artikel ueber Suche
      oeffnen; Tabellen-ID, Feld-ID, Feldvalidierung, Nummer, Buchungsgruppe und
      Dimension gegen die freigegebene Baseline lesen; importieren, Paket
      prüfen, Paket anwenden und Fehlerprotokoll lesen; erzeugte Belege und
      Posten per Navigate oder Drill-down kontrollieren; Abweichung
      protokollieren; Korrektur anwenden; denselben Fall mit identischen
      Eingaben retesten. Die Agenda aus UABC-MTG-001 bindet datenworkshop an
      Eingabe, BC-Seite, Feld, Aktion, Ergebnis, Kontrolle, Abweichung,
      Korrektur und Retest. Ablaufmerkmal fachanker-af. Feldmapping,
      Formatpruefung, Qualitaetschecks und Freigabe werden je Datenwelle
      protokolliert.


      Ergebnis und Akzeptanz

      Datenworkshop liefert fuer data ein pruefbares Ergebnis. 7 Debitoren, 5
      Kreditoren, 12 Artikel und alle Kontrollsummen werden ohne Dublette
      uebernommen. Akzeptiert wird ausschliesslich der synthetische
      Simulationsnachweis nach Prüfung durch die benannten Rollen; eine reale
      Kundensystemabnahme wird nicht behauptet. Die Datenfreigabe ist innerhalb
      der Simulation dokumentiert.


      Lieferung und Referenzen

      datenworkshop liefert UABC-DEL-BCB-001. Transkript UABC-MTG-001, Nachweis
      docs/offers/bc-basic-offer.md, project/bc-basic/project-plan.yaml und
      Seiten PAGE-UABC-130 bleiben bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-af auf Konfigurationspakete / Debitoren /
      Kreditoren / Artikel: Tabellen-ID, Feld-ID, Feldvalidierung, Nummer,
      Buchungsgruppe und Dimension. 7 Debitoren, 5 Kreditoren, 12 Artikel und
      alle Kontrollsummen werden ohne Dublette uebernommen. Eine relevante
      Abweichung wurde erfasst, fachlich korrigiert und mit unveraenderter
      Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Ausschliesslich das Aufwandsnachweis WL-UABC-32-V3 ist fakturierbar;
      Elternwerte sind reine Rollups. Die Wochenrechnung wird aus genehmigten
      Task-Iststunden erzeugt. Plan und Ist werden getrennt ausgewiesen;
