      Beispielkunde Saarblick Handel & Service GmbH; Ziel ist ein belastbarer
      Verkauf-Nachweis ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer verkauf-einrichten werden Verkaufsaufträge / Gebuchte
      Verkaufslieferungen / Gebuchte Verkaufsrechnungen, die Felder
      Debitorennummer, Lagerortcode, Menge, Verkaufspreis und
      USt.-Produktbuchungsgruppe, die Aktion Buchungsvorschau prüfen, liefern
      und fakturieren, Beleg-/Postenwirkungen, Kontrollsumme, Ausnahme,
      Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext verkauf-einrichten umfasst weder Continia noch
      produktive Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Debitorennummer, Lagerortcode, Menge, Verkaufspreis und
      USt.-Produktbuchungsgruppe. Simulierte Verantwortung: Julia Brandt
      (Verkauf Key User), Verfuegbarkeit Taeglich 10:00-16:00; simuliert.
      Beratung: Kajetan Kalicki als reale Universaarl-Projektleitung und
      leitender BC-Berater. Pruefkontext fachanker-w.


