      prozessbild an Eingabe, BC-Seite, Feld, Aktion, Ergebnis, Kontrolle,
      Abweichung, Korrektur und Retest. Ablaufmerkmal fachanker-e.


      Ergebnis und Akzeptanz

      Prozessbild liefert fuer project ein pruefbares Ergebnis. Scope, RACI,
      Budget und Gateentscheidung sind nachvollziehbar verknuepft. Akzeptiert
      wird ausschliesslich der synthetische Simulationsnachweis nach Prüfung
