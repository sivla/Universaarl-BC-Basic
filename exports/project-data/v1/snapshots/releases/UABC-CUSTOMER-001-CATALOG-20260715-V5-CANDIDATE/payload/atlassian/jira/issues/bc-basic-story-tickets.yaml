    summary: O2C testen
    description: >-
      Ausgangslage und Ziel

      O2C testen (UABC-38) beginnt im Arbeitskontext o2c-testen erst am
      2026-04-30. Ausgangslage ist der ausdrücklich simulierte Beispielkunde
      Saarblick Handel & Service GmbH; Ziel ist ein belastbarer Verkauf-Nachweis
      ohne Live-Tenant-Behauptung.


      Im Umfang

      Fuer o2c-testen werden Verkaufsaufträge / Gebuchte Verkaufslieferungen /
      Gebuchte Verkaufsrechnungen, die Felder Debitorennummer, Lagerortcode,
      Menge, Verkaufspreis und USt.-Produktbuchungsgruppe, die Aktion
      Buchungsvorschau prüfen, liefern und fakturieren, Beleg-/Postenwirkungen,
      Kontrollsumme, Ausnahme, Korrektur und Retest bearbeitet.


      Nicht im Umfang

      Der Arbeitskontext o2c-testen umfasst weder Continia noch produktive
      Buchung, Bankfeed, ELSTER-Uebertragung, Steuerberatung, echte
      Kundenfreigabe oder Zugriff auf ein reales Business-Central-System.


      Voraussetzungen und Rollen

      Kundeneingaben: Debitorennummer, Lagerortcode, Menge, Verkaufspreis und
      USt.-Produktbuchungsgruppe. Simulierte Verantwortung: Julia Brandt
      (Verkauf Key User), Verfuegbarkeit Taeglich 10:00-16:00; simuliert.
      Beratung: Kajetan Kalicki als reale Universaarl-Projektleitung und
      leitender BC-Berater. Pruefkontext fachanker-al.


      Durchführung

      Verkaufsaufträge / Gebuchte Verkaufslieferungen / Gebuchte
      Verkaufsrechnungen ueber Suche oeffnen; Debitorennummer, Lagerortcode,
      Menge, Verkaufspreis und USt.-Produktbuchungsgruppe gegen die freigegebene
      Baseline lesen; Buchungsvorschau prüfen, liefern und fakturieren; erzeugte
      Belege und Posten per Navigate oder Drill-down kontrollieren; Abweichung
      protokollieren; Korrektur anwenden; denselben Fall mit identischen
      Eingaben retesten. Die Agenda aus UABC-MTG-003 bindet o2c-testen an
      Eingabe, BC-Seite, Feld, Aktion, Ergebnis, Kontrolle, Abweichung,
      Korrektur und Retest. Ablaufmerkmal fachanker-al.


      Ergebnis und Akzeptanz

      O2C testen liefert fuer o2c ein pruefbares Ergebnis. 10 STK mal 79,00
      ergeben 790,00 netto, 150,10 Umsatzsteuer und 940,10 Debitor. Akzeptiert
      wird ausschliesslich der synthetische Simulationsnachweis nach Prüfung
      durch die benannten Rollen; eine reale Kundensystemabnahme wird nicht
      behauptet.


      Lieferung und Referenzen

      o2c-testen liefert UABC-DEL-BCB-003. Transkript UABC-MTG-003, Nachweis
      project/bc-basic/data-package.yaml,
      project/bc-basic/data-readiness-check.yaml und Seiten PAGE-UABC-050
      bleiben bidirektional referenziert.


      Nachweis, Test und Rücklesekontrolle

      Rücklesekontrolle fachanker-al auf Verkaufsaufträge / Gebuchte
      Verkaufslieferungen / Gebuchte Verkaufsrechnungen: Debitorennummer,
      Lagerortcode, Menge, Verkaufspreis und USt.-Produktbuchungsgruppe. 10 STK
      mal 79,00 ergeben 790,00 netto, 150,10 Umsatzsteuer und 940,10 Debitor.
      Eine relevante Abweichung wurde erfasst, fachlich korrigiert und mit
      unveraenderter Ausgangslage erneut getestet.


      Aufwand und Abrechnung

      Ausschliesslich das Aufwandsnachweis WL-UABC-38-V3 ist fakturierbar;
      Elternwerte sind reine Rollups. Die Wochenrechnung wird aus genehmigten
      Task-Iststunden erzeugt. Plan und Ist werden getrennt ausgewiesen;
      Abrechnungsmerkmal fachanker-al.


      Abhängigkeiten, Risiken und Übergabe

      Risiko o2c-testen: Im Arbeitskontext o2c-testen kann eine falsche Feld-
      oder Buchungsgruppenzuordnung nachgelagerte o2c-Kontrollen verfaelschen.
      Gateberechtigung liegt bei Julia Brandt nur innerhalb der Simulation. Nach
      bestandenem Retest wird Geprueftes Ergebnis o2c-testen an den fachlichen
      fachlich Verantwortlichen und das naechste Projektgate uebergeben.
