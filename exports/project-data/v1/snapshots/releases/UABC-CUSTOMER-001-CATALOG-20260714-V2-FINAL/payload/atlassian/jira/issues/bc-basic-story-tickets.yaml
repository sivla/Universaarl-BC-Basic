    summary: Projektstart
    description: >-
      Ausgangslage und Ziel

      Projektstart (UABC-1): Projektauftrag, Rollen und Entscheidungswege für
      die Kundeninstanz. Die Kundeninstanz wird als realitätsnahe
      repositorybasierte Simulation betrachtet; Ziel ist ein nachvollziehbarer
      fachlicher Nachweis, keine Behauptung eines echten Tenant- oder
      Produktivzugriffs.


      In Scope

      Projektstart (UABC-1): Phasensteuerung und Abhängigkeiten für
      Projektauftrag, Rollen und Entscheidungswege für die Kundeninstanz.


      Nicht im Umfang

      Projektstart (UABC-1): Kein echter Business-Central-Tenant, kein
      Live-Posting, keine reale Steueranmeldung, keine produktive Kundenfreigabe
      und keine Änderung außerhalb der dokumentierten Simulation.


      Voraussetzungen und Rollen

      Projektstart (UABC-1): Kundeneingaben sind Sponsorauftrag, Scopegrenzen,
      Rollenliste und Entscheidungsweg. Kundenrollen: ROLE-CUSTOMER-SPONSOR und
      Projektleitung. Consultantrollen: Projektleitung und Solution Architect.


      Durchführung

      Projektstart (UABC-1): Phasensteuerung mit Eintritt, Austritt und
      Abhängigkeiten in Phase P1. Konkrete Schritte: Auftrag prüfen, Rollen
      benennen, Scope-Baseline ablegen und Eintrittsgate protokollieren. Agenda:
      Auftrag, Scope, Rollen, Budget, Risiken und Gateentscheidung.


      Ergebnis und Akzeptanz

      Projektstart (UABC-1): Phase 1 besitzt einen entschiedenen Scope, benannte
      Rollen und ein prüfbares Eintrittsgate. Die Akzeptanz gilt für die
      synthetische Simulation und nicht für ein reales Kundensystem.


      Lieferung und Referenzen

      Projektstart (UABC-1): Evidence
      evidence/playthru-uabc-basic-de/setup-wave-1-read-only-preflight.yaml,
      evidence/playthru-uabc-basic-de/setup-wave-1-control-center-run-plan.yaml,
      project/bc-basic/pilot-setup-baseline.yaml; Lieferobjekte Phase 1 –
      Vorbereitung und Datenbereitschaft; Confluence
      atlassian/confluence/pages/80-bc-basic-project-overview.md;
      Meetingtranskript UABC-MTG-001.


      Evidence, Test und Readback

      Projektstart (UABC-1): Evidence wird aus dem Repository gelesen. Readback:
      Projektauftrag, Rollenregister und Gateprotokoll. Posting-Kontrolle,
      Defect, Korrektur und Retest werden nur als synthetische Schritte
      ausgewiesen. Acht reale Kundengates bleiben außerhalb der Simulation
      offen.


      Aufwand und Abrechnung

      Projektstart (UABC-1): Nicht separat abrechenbar; Aufwand rollt fachlich
      aus untergeordneten Tasks hoch. Die Abrechnung folgt ausschließlich der
      bestehenden Task-Worklog-Logik.


      Abhängigkeiten, Risiken und Übergabe

      Projektstart (UABC-1): Abhängigkeiten keine direkte Vorgängerabhängigkeit.
      Risiko: Unklare Entscheidungsrechte verzögern Discovery und Datenfreigabe.
      Übergabe: Phase 1 an Discovery und Datenbereitschaft.
