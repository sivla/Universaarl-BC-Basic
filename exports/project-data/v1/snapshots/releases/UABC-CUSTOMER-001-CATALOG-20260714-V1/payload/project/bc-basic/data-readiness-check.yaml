checks:
  - id: UABC-DATA-CHECK-001
    subject: Vollstaendigkeit
    rule: Alle acht Blanko-/Beispielpaare sind parsebar und alle Pflichtfelder der Beispieldaten sind gefuellt.
  - id: UABC-DATA-CHECK-002
    subject: Eindeutigkeit
    rule: Technische Schluessel der Gesellschaft sowie der Dimensionen und Stammdaten sind je Objekt eindeutig.
  - id: UABC-DATA-CHECK-003
    subject: Buchungsgruppenabhaengigkeiten
    rule: Buchungsgruppen- und Steuerwerte sind fuer die Referenzsimulation simulated-approved; fuer eine reale Kundeninstanz bleiben sie Kandidaten bis zur fachlichen sowie Legal-/Tax-Bestaetigung.
  - id: UABC-DATA-CHECK-004
    subject: Summenabstimmung
    rule: Anfangsbestand entspricht Menge mal Einstandspreis; Soll entspricht Haben; offene Debitoren- und Kreditorenposten stimmen mit den jeweiligen Sammelkontenrollen ab.
  - id: UABC-DATA-CHECK-005
    subject: Synthetische Klassifikation
    rule: Jeder Beispieldatensatz ist als synthetisch gekennzeichnet und enthaelt keine realen Personen-, Bank-, Steuer- oder Belegdaten.
  - id: UABC-DATA-CHECK-006
    subject: Offene Freigaben
    rule: Kontenplan-, Buchungsgruppen-, Steuer- und Schreibfreigaben bleiben sichtbar und werden nicht aus Beispieldaten abgeleitet.
