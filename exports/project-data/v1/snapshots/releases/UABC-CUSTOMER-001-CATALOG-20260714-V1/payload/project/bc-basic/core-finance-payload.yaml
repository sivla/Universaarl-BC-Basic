executionContract:
  packageToolAudience: bc-consultant-only
  customerTrainingScope: [Dimensionen auf Belegen verwenden, Zahlungsbedingungen auswählen, Lagerort HAUPT auswählen]
  importFlow:
    - Konfigurationspakete suchen und Paket UABC-01-CORE-FINANCE öffnen.
    - Tabellen in der Manifestreihenfolge aufnehmen und je Tabelle ausschließlich requiredFields plus freigegebene optionalFields aktivieren.
    - Von BC erzeugte Excelvorlage exportieren, Payloadwerte tabellenweise übertragen und über Import from Excel einlesen.
    - Validate Package ausführen; bei einem Fehler nicht Apply Package wählen.
    - Nach separater Write-Freigabe Apply Package einmal ausführen und alle Readbacks erfassen.
  expectedErrors:
    - { code: DUPLICATE-NATURAL-KEY, correction: Istzeile lesen und erwartete Operation auf update oder no-op festlegen, retest: Paket erneut validieren }
    - { code: MISSING-FOREIGN-KEY, correction: Vorgängertabelle oder fehlenden Schlüssel zuerst herstellen, retest: Abhängigkeits- und Paketvalidierung wiederholen }
    - { code: NONEDITABLE-FIELD, correction: Feld aus dem Paket entfernen und als manuellen Readbackschritt dokumentieren, retest: Feldliste und Paket erneut validieren }
    - { code: TAX-CONFIRMATION-OPEN, correction: Steuerliche Bestätigung dokumentieren oder Apply gesperrt lassen, retest: confirmationStatus prüfen }
  afterApplyControls:
    - 51 Paketdatensätze feldgenau lesen; Anlegen, Aktualisieren oder unverändert Belassen je natürlichem Schlüssel dokumentieren.
    - 18 manuelle PRESEED-/Singleton-/Periodenwerte feldgenau mit Vorher/Nachher erfassen.
    - Konten-, Buchungsgruppen-, VAT-, Dimensions- und Nummernserienreferenzen ohne Differenz prüfen.
    - Sachposten, Debitorenposten, Kreditorenposten, MwSt.-Posten, Bankposten und Artikelposten bleiben unverändert.
    - TRADE-MASTER und OPENING-DATA bleiben 0 Tabellen, 0 Datensätze, 0 Fehler.
  stopConditions: [W0-Gate offen, Resetpunkt fehlt, Write-Freigabe fehlt, Paketfehler ungleich 0, unbekannter Schlüssel, Ledger- oder gebuchte Tabelle, reale Bankkennung, Steuerbestätigung offen, unerwarteter Dialog]
  correctionScope: Ausschließlich natürliche Schlüssel und Felder dieses Payloads; keine Ledger-/Posten-/Belegtabellen und keine fremden Gesellschaften.
