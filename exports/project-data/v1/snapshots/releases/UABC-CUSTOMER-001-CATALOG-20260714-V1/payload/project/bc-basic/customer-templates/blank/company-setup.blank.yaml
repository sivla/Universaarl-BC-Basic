  eori:
    description: EORI bleibt ohne fachliche Pruefung leer
    required: false
    allowedValues: leer bis validiert
  gln:
    description: GLN bleibt ohne fachliche Pruefung leer
    required: false
    allowedValues: leer bis validiert
  bankName:
    description: Bankname bleibt bis eigener Bankbaseline leer
    required: false
    allowedValues: leer bis validiert
  bankBranchNo:
    description: Bankleitzahl bleibt bis eigener Bankbaseline leer
    required: false
    allowedValues: leer bis validiert
  iban:
    description: IBAN bleibt bis eigener Bankbaseline leer
    required: false
    allowedValues: leer bis validiert
  swift:
    description: SWIFT bleibt bis eigener Bankbaseline leer
    required: false
    allowedValues: leer bis validiert
