dataCategories:
  einrichtungsdaten: Konten, Buchungsgruppen, MwSt.-Einrichtung, Dimensionen, Zahlungsbedingungen, Nummernserien und Lagerortvorbereitung.
  stammdaten: Debitoren, Kreditoren, Artikel, Einheiten, Preise, einfache Rabatte und Bankkonten als Stammdaten.
