name: universaarl-delivery
version: 1
description: Evidenzorientierter Universaarl-Lieferworkflow mit explizitem Plan und Nachweis
artifacts:
  - id: proposal
    generates: proposal.md
    description: Änderungsabsicht, Scope, Ergebnisse, Risiken und Governance
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Prüffähige Geschäftsanforderungen und Szenarien
    template: spec.md
    requires: [proposal]
  - id: design
    generates: design.md
    description: Fachliches, Lösungs- und Organisationsdesign
    template: design.md
    requires: [proposal]
  - id: delivery-plan
    generates: delivery-plan.md
    description: Wellen, Verantwortlichkeit, Abhängigkeiten, Evidence und Entscheidungs-Gates
    template: delivery-plan.md
    requires: [specs, design]
  - id: tasks
    generates: tasks.md
    description: Ausführbare Liefercheckliste
    template: tasks.md
    requires: [delivery-plan]
  - id: verification
    generates: verification.md
    description: Evidence-Register, Validierungsergebnisse und Freigabestatus
    template: verification.md
    requires: [tasks]
apply:
  requires: [tasks]
  tracks: tasks.md
