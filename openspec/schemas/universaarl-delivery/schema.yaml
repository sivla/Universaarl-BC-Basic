name: universaarl-delivery
version: 1
description: Nachweisorientierter Universaarl-Lieferablauf mit explizitem Plan und Verifikation
artifacts:
  - id: proposal
    generates: proposal.md
    description: Aenderungsabsicht, Umfang, Ergebnisse, Risiken und Steuerung
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Prueffaehige Geschaeftsanforderungen und Szenarien
    template: spec.md
    requires: [proposal]
  - id: design
    generates: design.md
    description: Fachliches, Loesungs- und Organisationsdesign
    template: design.md
    requires: [proposal]
  - id: delivery-plan
    generates: delivery-plan.md
    description: Wellen, Verantwortlichkeit, Abhaengigkeiten, Nachweise und Entscheidungspruefpunkte
    template: delivery-plan.md
    requires: [specs, design]
  - id: tasks
    generates: tasks.md
    description: Ausfuehrbare Liefercheckliste
    template: tasks.md
    requires: [delivery-plan]
  - id: verification
    generates: verification.md
    description: Nachweisregister, Validierungsergebnisse und Freigabestatus
    template: verification.md
    requires: [tasks]
apply:
  requires: [tasks]
  tracks: tasks.md
