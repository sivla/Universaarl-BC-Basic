stopConditions:
  - Wave-0-Preflight oder evidenzbasierte Pilot-Zielentscheidung fehlt.
  - Ziel ist nicht exakt Playthru/UABC-BASIC-DE.
  - Anwendung oder DE-Lokalisierung weicht vom Vertrag ab.
  - Resetpunkt oder Wiederanlaufweg fehlt.
  - Ein Paket besitzt vor dem Lauf nicht 0/0/0.
  - Tabellen-ID loest auf einen anderen Namen auf oder ist nicht vorhanden.
  - Direkte Tabellenberechtigung fehlt.
  - Ledger-, Posted-, Register- oder Continia-Tabelle erscheint.
  - Nicht freigegebenes Feld oder Extensionfeld wird automatisch aufgenommen.
  - Das Anwenden wuerde UABC-02-TRADE-MASTER oder UABC-03-OPENING-DATA betreffen.
  - Unerwarteter Dialog, Fehler oder nicht erklaerbare Datenwirkung erscheint.
  - Eine Buchung, externe Uebermittlung oder produktive Integration wird angeboten.
stopCodes:
  - { code: UABC-STOP-01, condition: Wave-0-Zielbindung Ausgangsprovenienz interne Company-ID oder Pilot-Zielentscheidung fehlt beziehungsweise ist nicht exakt Playthru/UABC-BASIC-DE }
  - { code: UABC-STOP-02, condition: CORE-Paket-ID, Name, Tabellen-ID oder Tabellenname weicht von der Allowlist ab }
  - { code: UABC-STOP-03, condition: UABC-02-TRADE-MASTER oder UABC-03-OPENING-DATA erzeugt einen Schreibschritt }
  - { code: UABC-STOP-04, condition: Abhaengigkeit oder Reihenfolge ist nicht aufgeloest }
  - { code: UABC-STOP-05, condition: Quellenvertrag oder Parameterbaseline nicht aufloesbar }
  - { code: UABC-STOP-06, condition: Feld ist nicht disjunkt oder nicht positivgelistet }
  - { code: UABC-STOP-07, condition: Ledger Posted Continia Buchung oder Uebermittlung erscheint }
  - { code: UABC-STOP-08, condition: Write ohne zugeordnetes Readback erscheint }
rollback:
  beforeApply: Neu aufgenommene Paketzeilen entfernen oder auf den dokumentierten Paketdefinitionsstand zuruecksetzen.
  afterPartialApply: Sofort stoppen, erzeugte synthetische Setupcodes per Seite inventarisieren und nur diese gezielt ruecknehmen; bei unklarer Wirkung die eindeutig markierte Pilotgesellschaft auf den dokumentierten Resetpunkt zuruecksetzen.
  forbidden: [UNIVERSAARL-DE veraendern, unbekannte Datensaetze loeschen, blind erneut anwenden]
requiredReturnedEvidence:
  - Run-ID, Zeit Europe/Berlin, menschliche Verantwortungsrolle und Automationsakteur
  - sichtbare Ziel-, Versions-, Rollen-, Arbeitsdatum- und Resetpunktpruefung
  - vorher/nachher Paketzaehler je Paket
  - je aufgenommener Tabelle ID, aufgeloester Name und Feldliste
  - Paketpruefung und Fehlerliste
  - wenige bereinigte Screenshots von Zielbindung, Paketmatrix, Pruefergebnis und Readback
  - Readback je Setupbereich und Negativnachweis ohne Ledger-/Postingwirkung
  - Defect, Korrektur und Retest oder explizit kein Defect beobachtet
  - keine Auth-, Session-, Telemetry- oder Browserprofildaten
